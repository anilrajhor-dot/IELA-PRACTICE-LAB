            <Icon name="account_balance" size={20} className="text-amber-400"  />
            <h1 className="serif text-lg font-bold tracking-wide">IELA Credit Advisor</h1>
          </div>
          <div className="flex items-center gap-1">
            <button
              onClick={() => {
                setBpmOpen(true);
                loadSubmissions();
              }}
              className="p-2 rounded-md hover:bg-emerald-800"
              aria-label="BPM Submissions"
            >
              <Icon name="group" size={19}  />
            </button>
            <button onClick={() => setFsOpen(true)} className="p-2 rounded-md hover:bg-emerald-800" aria-label="Financial Statements for Bank">
              <Icon name="description" size={19}  />
            </button>
            <button onClick={() => setClafOpen(true)} className="p-2 rounded-md hover:bg-emerald-800" aria-label="Common Loan Application Form">
              <Icon name="account_balance" size={19}  />
            </button>
            <button onClick={() => setDiagOpen(true)} className="relative p-2 rounded-md hover:bg-emerald-800" aria-label="Health Check">
              <Icon name="checklist" size={19}  />
              {issues.length > 0 && (
                <span className="absolute -top-0.5 -right-0.5 bg-amber-600 text-xs font-bold rounded-full w-4 h-4 flex items-center justify-center">
                  {issues.length}
                </span>
              )}
            </button>
            <button onClick={() => setChatOpen(true)} className="p-2 rounded-md hover:bg-emerald-800" aria-label="Chat">
              <Icon name="chat" size={19}  />
            </button>
          </div>
        </div>
        <p className="text-xs text-emerald-100 mt-0.5">DAY-NRLM Annexure III — Enterprise Loan Business Analysis / उद्यम ऋण व्यवसाय विश्लेषण</p>
        <p className="text-xs text-amber-300 mt-0.5 font-medium">Developed by Anil Sharma, former General Manager, Central Bank of India · v{APP_VERSION}</p>
        <p className="text-xs text-red-300 mt-1">■ Red text/values = calculated automatically — you don't need to type these yourself. / लाल रंग का पाठ स्वतः गणना होता है, इसे स्वयं भरने की आवश्यकता नहीं।</p>
      </div>

      {practice && <PracticeBanner practice={practice} onRestore={restoreOwnData} />}
      {pcNote && <div className="bg-green-100 text-green-900 text-xs px-4 py-2 flex justify-between gap-2"><span>{pcNote}</span><button onClick={() => setPcNote("")} aria-label="Dismiss" className="font-bold">✕</button></div>}
      <div className="flex overflow-x-auto no-print border-b border-stone-300 bg-stone-100">
        {STEPS.map((s, i) => (
          <button
            key={s}
            onClick={() => setStep(i)}
            className={`flex-1 text-center px-2 py-3 text-xs font-semibold border-b-2 transition-colors ${
              i === step ? "border-amber-600 text-emerald-900" : i < step ? "border-green-700 text-green-700" : "border-transparent text-stone-400"
            }`}
          >
            <span className="mono block text-xs mb-0.5">{String(i + 1).padStart(2, "0")}</span>
            {s}
          </button>
        ))}
      </div>

      <div className="max-w-md mx-auto p-4 pb-40">
        {step === 0 && (
          <section>
            <h2 className="serif text-xl font-bold mb-1">A/B. SHG & Member Identification / सदस्य पहचान</h2>
            <div className="flex gap-2 flex-wrap mb-3">
              <button onClick={loadSampleData} className="text-xs px-2 py-1 rounded-full border border-amber-600 text-amber-700 font-semibold whitespace-nowrap">
                Load Sample Data
              </button>
              <button onClick={downloadDemoData} className="text-xs px-2 py-1 rounded-full border border-amber-600 text-amber-700 font-semibold whitespace-nowrap">
                Download Demo Data (to study) / डेमो डेटा डाउनलोड करें
              </button>
              <button onClick={exportData} className="text-xs px-2 py-1 rounded-full border border-emerald-900 text-emerald-900 font-semibold whitespace-nowrap">
                Export Data / डेटा निर्यात करें
              </button>
              <label className="text-xs px-2 py-1 rounded-full border border-emerald-900 text-emerald-900 font-semibold whitespace-nowrap cursor-pointer">
                Import Data / डेटा आयात करें
                <input type="file" accept=".json,application/json" className="hidden" onChange={(e) => e.target.files[0] && importData(e.target.files[0])} />
              </label>
              <button onClick={() => setHelpOpen(true)} className="text-xs px-2 py-1 rounded-full border border-emerald-900 bg-emerald-900 text-white font-semibold whitespace-nowrap">
                Help / How to use / सहायता
              </button>
              <button onClick={() => setPcOpen(true)} className="text-xs px-2 py-1 rounded-full border border-red-700 text-red-800 font-semibold whitespace-nowrap">
                Import Practice Case / अभ्यास केस आयात
              </button>
              <button onClick={() => setDiagOpen(true)} className="text-xs px-2 py-1 rounded-full border border-teal-700 text-teal-700 font-semibold whitespace-nowrap">
                Health Check / स्वास्थ्य जांच {issues.length > 0 ? `(${issues.length})` : ""}
              </button>
              <button onClick={() => setFsOpen(true)} className="text-xs px-2 py-1 rounded-full border border-emerald-900 text-emerald-900 font-semibold whitespace-nowrap">
                Financial Statements for Bank / बैंक हेतु वित्तीय विवरण
              </button>
              <button onClick={() => setClafOpen(true)} className="text-xs px-2 py-1 rounded-full border border-amber-600 text-amber-700 font-semibold whitespace-nowrap">
                Common Loan Application / ऋण आवेदन पत्र
              </button>
              <button
                onClick={() => {
                  if (window.confirm(practice ? "Delete the PRACTICE data and go back to your own application? / अभ्यास डेटा हटाकर अपने आवेदन पर लौटें?" : "Delete ALL data in this app? This cannot be undone. / क्या सभी डेटा हटाना है? इसे वापस नहीं लाया जा सकता।")) deleteAllData();
                }}
                className="text-xs px-2 py-1 rounded-full border border-red-700 text-red-700 font-semibold whitespace-nowrap"
              >
                Delete All Data / सभी डेटा हटाएं
              </button>
            </div>
            {restoredFromAutosave && (
              <Banner tone="ok">Your previous data was automatically restored from this device. / आपका पिछला डेटा इस डिवाइस से स्वतः पुनर्स्थापित हो गया।</Banner>
            )}
            {importOk && <Banner tone="ok">Data imported successfully — check each step to confirm. / डेटा सफलतापूर्वक आयात हुआ।</Banner>}
            {importError && <Banner tone="danger">{importError}</Banner>}
            <p className="text-sm text-stone-600 mb-3">
              ★ = mandatory / अनिवार्य · Your entries are saved automatically on this device and remain even if you close the app. "Download Demo Data" saves a study copy without touching your current work. Before starting a different member's application, tap "Delete All Data" to clear everything first. / "Download Demo Data" आपके वर्तमान कार्य को प्रभावित किए बिना अध्ययन प्रति सहेजता है। किसी अन्य सदस्य का आवेदन शुरू करने से पहले "Delete All Data" दबाएं।
            </p>
            <SubHeading>A. SHG Details / एसएचजी विवरण</SubHeading>
            <FieldGrid fields={SHG_FIELDS} obj={identity} setObj={setIdentity} />
            <SubHeading>B. Member Identification / सदस्य पहचान</SubHeading>
            <FieldGrid fields={MEMBER_FIELDS} obj={identity} setObj={setIdentity} />

            <SubHeading>C. Documents Checklist / दस्तावेज़ सूची</SubHeading>
            <Card>
              {DOCUMENTS.map((d) => (
                <div key={d.k} className="py-2 border-b border-stone-200 last:border-0">
                  <div className="flex justify-between items-center">
                    <span className="text-sm">{d.l}{d.mandatory && <span className="text-red-700"> ★</span>}</span>
                    <select
                      value={documents[d.k].status}
                      onChange={(e) => setDocuments({ ...documents, [d.k]: { ...documents[d.k], status: e.target.value } })}
                      className="text-xs border border-stone-400 rounded-md px-1.5 py-1 bg-white"
                    >
                      {["Pending", "Collected", "Not Applicable"].map((o) => <option key={o}>{o}</option>)}
                    </select>
                  </div>
                </div>
              ))}
            </Card>
          </section>
        )}

        {step === 1 && (
          <section>
            <h2 className="serif text-xl font-bold mb-1">D/E/F. Enterprise & Loan</h2>
            <SubHeading>D. Enterprise Information / उद्यम जानकारी</SubHeading>
            <FieldGrid fields={ENTERPRISE_FIELDS} obj={enterprise} setObj={setEnterprise} />

            <SubHeading>E. Member Credit History with SHG & Banks / एसएचजी व बैंक ऋण इतिहास</SubHeading>
            <FieldGrid fields={CREDIT_HISTORY_FIELDS} obj={credit} setObj={setCredit} />

            <SubHeading>F2. Working Capital Details / कार्यशील पूंजी विवरण (केवल WC ऋण हेतु)</SubHeading>
            <FieldGrid fields={F2_FIELDS} obj={wc} setObj={setWc} />
            <Field label="Working Capital Limit Required / आवश्यक कार्यशील पूंजी सीमा" mandatory>
              <NumInput value={wc.wcLoanAmount} onChange={(v) => setWc({ ...wc, wcLoanAmount: v })} />
            </Field>
            <Field label="Margin % (edit if the bank requires a different margin — default 10%) / मार्जिन % (बैंक द्वारा अलग मार्जिन की आवश्यकता होने पर बदलें)">
              <NumInput prefix="%" value={wc.marginPercent} onChange={(v) => setWc({ ...wc, marginPercent: v })} />
            </Field>
            <Card>
              <Row label="Margin Amount (auto)" value={inr(num(wc.totalWcRequired) - num(wc.wcLoanAmount))} auto last />
            </Card>
            <Field label="Cost of Material Purchased (auto = Limit ÷ (1 − Margin%), so Cost − Margin = Limit above)" auto>
              <NumInput value={wc.totalWcRequired} onChange={(v) => setWc({ ...wc, totalWcRequired: v })} />
            </Field>
            <Card title="Auto-split of the cycle above (used in Step 3 Balance Sheet)">
              {calc.rawMaterialDays > 0 && <Row label="Raw Material Holding" value={`${calc.rawMaterialDays} days`} auto />}
              <Row label={calc.rawMaterialDays > 0 ? "+ Stock Holding (Finished Goods)" : "Stock Holding"} value={`${calc.stockHoldingDays} days`} auto />
              <Row label="+ Debtors" value={`${calc.debtorsDays} days`} auto />
              <Row label="− Suppliers' Credit" value={`${calc.suppliersDays} days`} auto />
              <Row label="= Net Working Capital Cycle" value={`${calc.rawMaterialDays + calc.stockHoldingDays + calc.debtorsDays - calc.suppliersDays} days`} bold last auto />
            </Card>

            <SubHeading>F3. Term Loan Details / टर्म लोन विवरण (केवल TL ऋण हेतु)</SubHeading>
            <FieldGrid fields={F3_FIELDS} obj={tl} setObj={setTl} />
            <Field label="Quoted Price of Asset / परिसंपत्ति का उद्धृत मूल्य" mandatory>
              <NumInput value={tl.quotedPrice} onChange={(v) => setTl({ ...tl, quotedPrice: v })} />
            </Field>
            <Field label="Margin % (edit if the bank requires a different margin — default 10%) / मार्जिन % (बैंक द्वारा अलग मार्जिन की आवश्यकता होने पर बदलें)">
              <NumInput prefix="%" value={tl.marginPercent} onChange={(v) => setTl({ ...tl, marginPercent: v })} />
            </Field>
            <Card>
              <Row label="Margin Amount (auto)" value={inr(num(tl.quotedPrice) - num(tl.tlAmount))} auto last />
            </Card>
            <Field label="Term Loan Amount Requested = Quoted Price − Margin (auto-suggested, override if needed) / अनुरोधित टर्म लोन राशि" auto>
              <NumInput value={tl.tlAmount} onChange={(v) => setTl({ ...tl, tlAmount: v })} />
            </Field>
            <Field label="Repayment Period Requested (Months, EMI-paying period — EXCLUDING moratorium above) / अनुरोधित पुनर्भुगतान अवधि (केवल ईएमआई अवधि, अधिस्थगन को छोड़कर)"><NumInput prefix="#" value={loanF.tenureMonths} onChange={(v) => setLoanF({ ...loanF, tenureMonths: v })} /></Field>
            <Field label="Interest Rate Informed to Applicant (% p.a.) / आवेदक को बताई गई ब्याज दर (% वार्षिक)"><NumInput prefix="%" value={loanF.interestRate} onChange={(v) => setLoanF({ ...loanF, interestRate: v })} /></Field>
            <Field label="Proposed Monthly EMI (auto-suggested from PMT on Term Loan only, override if needed) / प्रस्तावित मासिक ईएमआई (केवल टर्म लोन पर, स्वतः सुझाई गई)" auto>
              <NumInput value={loanF.proposedEmi} onChange={(v) => setLoanF({ ...loanF, proposedEmi: v })} />
            </Field>
            <Card>
              <Row label="Moratorium (payment-free)" value={`${calc.moratoriumMonths} months`} />
              <Row label="+ Repayment Period (EMI-paying)" value={`${num(loanF.tenureMonths)} months`} />
              <Row label="= Total Loan Period, start to final EMI" value={`${calc.moratoriumMonths + num(loanF.tenureMonths)} months`} bold last auto />
            </Card>
            <p className="text-xs text-stone-600 mb-3">EMI is calculated on the Term Loan amount only, over the Repayment Period (after any moratorium) — Working Capital is a revolving facility without a fixed EMI, assessed separately via the Tandon/Turnover methods below. / ईएमआई केवल टर्म लोन पर, पुनर्भुगतान अवधि (अधिस्थगन के बाद) पर गणना होती है।</p>

            <SubHeading>F1. Total Project Cost & Loan Summary / कुल परियोजना लागत व ऋण सारांश</SubHeading>
            <Field label="Source of Margin Money / मार्जिन मनी का स्रोत">
              <SelectInput value={loanF.marginSource} onChange={(v) => setLoanF({ ...loanF, marginSource: v })} opts={["Bank Savings Account", "SHG Savings", "Savings in Business", "Other"]} />
            </Field>
            <Card title="Auto-calculated from F2 + F3 above">
              <Row label="Working Capital Requirement (F2)" value={inr(num(wc.totalWcRequired))} />
              <Row label="+ Term Loan Asset Cost (F3)" value={inr(num(tl.quotedPrice))} />
              <Row label="= Total Project Cost" value={inr(calc.totalProjectCost)} bold auto />
              <Row label="Working Capital Loan Amount (F2)" value={inr(calc.wcLoanAmount)} />
              <Row label="+ Term Loan Amount (F3)" value={inr(calc.tlAmount)} />
              <Row label="= Total Loan Requested" value={inr(calc.totalLoanRequested)} bold auto />
              <Row label="Margin Money (Total Project Cost − Total Loan)" value={inr(calc.marginMoneyDerived)} last auto />
            </Card>
          </section>
        )}

        {step === 2 && (
          <section>
            <h2 className="serif text-xl font-bold mb-1">H. Financial Statement</h2>

            <SubHeading>Opening Stock / प्रारंभिक स्टॉक</SubHeading>
            <p className="text-xs text-stone-600 mb-2">
              Trading Account order: Opening Stock + Purchases − Closing Stock = COGS. Enter Opening Stock here, before Purchases below. Closing Stock is auto-linked later from the Balance Sheet (Raw Material + Finished Goods Stock) — no need to enter it twice.
            </p>
            <Field label="Opening Stock (value of stock at start of year)" help="Value of unsold raw material/finished goods stock you had at the beginning of the year. / वर्ष की शुरुआत में बचे हुए कच्चे माल/तैयार माल का मूल्य।">
              <NumInput value={openingStock} onChange={setOpeningStock} />
            </Field>

            <SubHeading>H1. Sales & Purchases / बिक्री व खरीद – पिछले 12 महीने</SubHeading>
            {["high", "low", "avg"].map((key) => {
              const row = calc.rows.find((r) => r.key === key);
              const periodLabel = key === "high" ? "High" : key === "low" ? "Low" : "Average";
              return (
                <div key={key} className="bg-white rounded-lg border border-stone-300 p-3 mb-3">
                  <p className="text-xs font-semibold text-stone-500 uppercase mb-2">
                    {key === "high" ? "High Sales Period" : key === "low" ? "Low Sales Period" : "Average Sales Period"}
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    <Field label="No. of Months"><NumInput prefix="#" value={h1[key].months} onChange={(v) => setH1({ ...h1, [key]: { ...h1[key], months: v } })} /></Field>
                    <Field label="Daily Sale (fill this, or leave blank and fill monthly instead)">
                      <NumInput value={h1[key].dailySale} onChange={(v) => setH1({ ...h1, [key]: { ...h1[key], dailySale: v } })} />
                    </Field>
                    {h1[key].dailySale !== "" ? (
                      <Field label={`Avg Monthly ${periodLabel} Sale`} auto>
                        <div className="mt-1 px-3 py-2 rounded-md bg-red-50 text-red-700 font-mono text-sm">{inr(row.avgMonthlySale)}</div>
                      </Field>
                    ) : (
                      <Field label={`Avg Monthly ${periodLabel} Sale (direct entry, since Daily Sale is blank)`}>
                        <NumInput value={h1[key].avgMonthlySaleManual} onChange={(v) => setH1({ ...h1, [key]: { ...h1[key], avgMonthlySaleManual: v } })} />
                      </Field>
                    )}
                    <Field label="Profit Margin %" mandatory><NumInput prefix="%" value={h1[key].margin} onChange={(v) => setH1({ ...h1, [key]: { ...h1[key], margin: v } })} /></Field>
                    <Field label="Avg Monthly Other Income"><NumInput value={h1[key].otherInc} onChange={(v) => setH1({ ...h1, [key]: { ...h1[key], otherInc: v } })} /></Field>
                  </div>
                </div>
              );
            })}
            {monthsTotal !== 12 && (
              <Banner tone="danger">
                Months must add up to 12 — currently {monthsTotal} ({monthsDiff > 0 ? `${monthsDiff} short` : `${Math.abs(monthsDiff)} too many`}). You cannot continue to the next step until this is fixed. / महीनों का योग 12 होना चाहिए।
              </Banner>
            )}
            <Card title="H1 Totals (auto)">
              <Row label="Avg Monthly Sale (blended, all periods)" value={inr(calc.avgMonthlySaleTotal)} auto />
              <Row label="Total Sales (12 months)" value={inr(calc.totalSales)} auto />
              <Row label="Blended Profit Margin %" value={pct(calc.blendedMargin)} auto />
              <Row label="Total Purchases" value={inr(calc.totalPurchases)} auto />
              <Row label="Total Other Income" value={inr(calc.totalOtherIncome)} auto last />
            </Card>

            <SubHeading>Trading Account: Gross Profit / व्यापार खाता: सकल लाभ</SubHeading>
            <p className="text-xs text-stone-600 mb-2">
              Cost of Goods Sold (COGS) = Opening Stock + Purchases − Closing Stock. This gives a more accurate Gross Profit than Sales − Purchases alone, since it accounts for unsold stock.
            </p>
            <Card>
              <Row label="Opening Stock" value={inr(num(openingStock))} />
              <Row label="+ Purchases (from H1)" value={inr(calc.totalPurchases)} auto />
              <Row label="− Closing Stock (auto, from Balance Sheet below)" value={inr(calc.closingStock)} auto />
              <Row label="= Cost of Goods Sold (COGS)" value={inr(calc.cogs)} bold auto />
              <Row label="Gross Profit (Sales − COGS)" value={inr(calc.grossProfit)} auto />
              <Row label="Gross Margin %" value={pct(calc.grossMargin)} bold last auto />
            </Card>
            {calc.cogs > calc.totalSales && calc.totalSales > 0 && (
              <Banner tone="warn">Cost of Goods Sold is higher than Sales — check Opening Stock, Purchases, and Closing Stock figures.</Banner>
            )}

            <SubHeading>H2. Income & Expenditure / आय व व्यय विवरण (वार्षिक)</SubHeading>
            <p className="text-xs text-stone-600 mb-2">Total Purchases and Total Sales are auto-linked from H1.</p>
            <NumList fields={H2_EXPENDITURE_FIELDS} obj={h2} setObj={setH2} />

            <Banner tone="warn">
              Please fill the actual interest paid on each outstanding loan below, from the passbook/statement — this is a required manual entry, not auto-calculated, since the real figure depends on the balance through the year, not just the year-end outstanding amount. / कृपया प्रत्येक बकाया ऋण पर वास्तविक भुगतान किया गया ब्याज पासबुक से भरें — यह आवश्यक मैनुअल प्रविष्टि है, स्वतः गणना नहीं होती।
            </Banner>
            {num(credit.shgLoanOutstanding) > 0 && (
              <>
                <Field label="Interest Paid to SHG (from passbook)" mandatory>
                  <NumInput value={h2.interestShgOverride} onChange={(v) => setH2({ ...h2, interestShgOverride: v })} />
                </Field>
                <p className="text-xs text-stone-600 -mt-2 mb-3">Rough reference only (Outstanding × Rate): {inr(calc.interestShgAuto)} — this is not used automatically; please enter the actual figure above.</p>
              </>
            )}
            {num(credit.bankLoanOutstanding) > 0 && (
              <>
                <Field label="Interest Paid on Bank Loan (from passbook/statement)" mandatory>
                  <NumInput value={h2.interestBankOverride} onChange={(v) => setH2({ ...h2, interestBankOverride: v })} />
                </Field>
                <p className="text-xs text-stone-600 -mt-2 mb-3">Rough reference only (Outstanding × Rate): {inr(calc.interestBankAuto)} — this is not used automatically; please enter the actual figure above.</p>
              </>
            )}
            {num(credit.informalLoan) > 0 && (
              <>
                <Field label="Interest Paid on Informal Loan (if any is charged)" mandatory>
                  <NumInput value={h2.interestInformalOverride} onChange={(v) => setH2({ ...h2, interestInformalOverride: v })} />
                </Field>
                <p className="text-xs text-stone-600 -mt-2 mb-3">Rough reference only (Outstanding × Rate): {inr(calc.interestInformalAuto)} — this is not used automatically; please enter the actual figure above.</p>
              </>
            )}
            {num(h3.clBankLoanST) > 0 && (
              <>
                <Field label="Interest Paid on Other Bank Loan/OD (Balance Sheet, from passbook)" mandatory>
                  <NumInput value={h2.interestOtherBankOverride} onChange={(v) => setH2({ ...h2, interestOtherBankOverride: v })} />
                </Field>
                <p className="text-xs text-stone-600 -mt-2 mb-3">Rough reference only (Outstanding × Rate): {inr(calc.interestOtherBankAuto)} — this is not used automatically; please enter the actual figure above.</p>
              </>
            )}
            <Field label="Government Subsidy / Grant Received"><NumInput value={govtSubsidy} onChange={setGovtSubsidy} /></Field>
            {num(h2.wages) + num(h2.familyLabour) > calc.totalSales && calc.totalSales > 0 && (
              <Banner tone="warn">Some expenditure heads look high relative to sales — please double check.</Banner>
            )}
            <Card>
              <Row label="Total Expenditure (A)" value={inr(calc.totalExpenditure)} auto />
              <Row label="Total Income (B)" value={inr(calc.totalIncome)} auto />
              <Row label="Net Profit / (Loss) [B − A]" value={inr(calc.netProfit)} bold last auto />
            </Card>
            {calc.netProfit < 0 && <Banner tone="danger">This shows a net loss for the year — repayment capacity will be weak.</Banner>}

            <SubHeading>H3. Balance Sheet / तुलन पत्र</SubHeading>
            <p className="text-xs text-stone-600 mb-2">
              {calc.rawMaterialDays > 0 ? "Raw Materials, Stock, Debtors, and Credit from Suppliers are" : "Stock, Debtors, and Credit from Suppliers are"} auto-calculated from the Total Working Capital Cycle entered in F2 (Step 2), split by Type of Enterprise: {calc.rawMaterialDays > 0 ? "Raw Material + Stock + Debtors − Suppliers' Credit" : "Stock + Debtors − Suppliers' Credit"} = your total ({calc.rawMaterialDays + calc.stockHoldingDays + calc.debtorsDays - calc.suppliersDays} days currently: {calc.rawMaterialDays > 0 ? `Raw Material ${calc.rawMaterialDays}d + ` : ""}Stock {calc.stockHoldingDays}d + Debtors {calc.debtorsDays}d − Suppliers {calc.suppliersDays}d). Adjust the total cycle in Step 2, or the Type of Enterprise, if this doesn't match reality. / स्टॉक, देनदार व आपूर्तिकर्ता उधार, F2 में दिए गए कुल चक्र व उद्यम प्रकार से स्वतः गणना होते हैं।
            </p>
            <p className="text-xs font-semibold text-stone-500 mb-1">A. Current Liabilities</p>
            <NumList
              fields={CL_FIELDS}
              obj={h3}
              setObj={setH3}
              extraRows={[
                { label: "SHG Loan Outstanding (auto, from Section E)", value: inr(num(credit.shgLoanOutstanding)) },
                { label: "Informal Loan (auto, from Section E)", value: inr(num(credit.informalLoan)) },
                { label: `Credit from Suppliers (auto, ${calc.suppliersDays} days)`, value: inr(calc.creditorsAuto) },
              ]}
            />
            {num(h3.clBankLoanST) > 0 && (
              <Field label="Interest Rate on Other Bank Loan/OD above (% p.a.) — needed so interest gets charged in the P&L" mandatory>
                <NumInput prefix="%" value={h3.clBankLoanSTRate} onChange={(v) => setH3({ ...h3, clBankLoanSTRate: v })} />
              </Field>
            )}

            <p className="text-xs font-semibold text-stone-500 mb-1 mt-3">B. Long-Term Liabilities</p>
            <NumList
              fields={LTL_FIELDS}
              obj={h3}
              setObj={setH3}
              extraRows={[{ label: "Bank Term Loan Outstanding (auto, from Section E)", value: inr(num(credit.bankLoanOutstanding)) }]}
            />

            <p className="text-xs font-semibold text-stone-500 mb-1 mt-3">A. Current Assets</p>
            <NumList
              fields={CA_FIELDS}
              obj={h3}
              setObj={setH3}
              extraRows={[
                { label: "Savings with SHG (auto, from Section E)", value: inr(num(credit.cumulativeShgSavings)) },
                { label: "Cash in Bank – Own SB A/c (auto, from Section E)", value: inr(num(credit.ownSbSavings)) },
                { label: "FD / RD with Bank (auto, from Section E)", value: inr(num(credit.fdRd)) },
                { label: "Other Savings / Investment (auto, from Section E)", value: inr(num(credit.otherSavings)) },
                ...(calc.rawMaterialDays > 0 ? [{ label: `Raw Materials (auto, ${calc.rawMaterialDays} days)`, value: inr(calc.rawMaterialValueAuto) }] : []),
                { label: `Value of Stock${calc.rawMaterialDays > 0 ? " / Finished Goods" : ""} (auto, ${calc.stockHoldingDays} days)`, value: inr(calc.stockValueAuto) },
                { label: `Debtors (auto, ${calc.debtorsDays} days)`, value: inr(calc.debtorsAuto) },
              ]}
            />

            <p className="text-xs font-semibold text-stone-500 mb-1 mt-3">B. Fixed Assets</p>
            <NumList fields={FA_FIELDS} obj={h3} setObj={setH3} />

            <p className="text-xs font-semibold text-stone-500 mb-1 mt-3">C. Other Assets</p>
            <NumList fields={OA_FIELDS} obj={h3} setObj={setH3} />

            <Field label="Drawings by Owner (memo only — not netted into capital)"><NumInput value={drawings} onChange={setDrawings} /></Field>

            <Card title="Balance Sheet Summary (auto)">
              <Row label="Total Current Liabilities" value={inr(calc.totalCL)} auto />
              <Row label="Total Long-Term Liabilities" value={inr(calc.totalLTL)} auto />
              <Row label="Owner's Capital = Total Assets − Liabilities other than capital" value={inr(calc.ownersCapital)} bold auto />
              <Row label="TOTAL LIABILITIES" value={inr(calc.totalLiabilities)} auto />
              <Row label="Total Current Assets" value={inr(calc.totalCA)} auto />
              <Row label="Total Fixed Assets" value={inr(calc.totalFA)} auto />
              <Row label="Total Other Assets" value={inr(calc.totalOA)} auto />
              <Row label="TOTAL ASSETS" value={inr(calc.totalAssets)} bold last auto />
            </Card>
            {calc.ownersCapital >= 0 ? (
              <Banner tone="ok">Owner's Capital works out to {inr(calc.ownersCapital)} — assets comfortably cover liabilities other than capital.</Banner>
            ) : (
              <Banner tone="danger">Owner's Capital is negative ({inr(calc.ownersCapital)}) — liabilities other than capital exceed total assets. Re-check entries; this points to technical insolvency.</Banner>
            )}
            <p className="text-xs text-stone-600 mb-4">Memo (not part of the capital formula): Net Profit for the year {inr(calc.netProfit)} · Drawings {inr(num(drawings))}.</p>

            <SubHeading>Working Capital Assessment / कार्यशील पूंजी मूल्यांकन</SubHeading>
            <p className="text-xs text-stone-600 mb-2">Two standard bank methods, computed from the Balance Sheet above.</p>

            <Card title="Tandon Committee Method">
              <Row label="Current Assets" value={inr(calc.totalCA)} auto />
              <Row label="Current Liabilities other than bank borrowings" value={inr(calc.clOtherThanBankBorrowings)} auto />
              <Row label="Working Capital Gap (CA − CL)" value={inr(calc.workingCapitalGap)} last auto />
            </Card>
            <Card title="Method I — MPBF = 75% of Working Capital Gap">
              <Row label="Maximum Permissible Bank Finance (MPBF)" value={inr(calc.tandonMethod1Mpbf)} auto />
              <Row label="Required Net Working Capital (25%, from long-term sources)" value={inr(calc.tandonMethod1Nwc)} last auto />
            </Card>
            <Card title="Method II — MPBF = 75% of CA − CL other than bank borrowings">
              <Row label="Maximum Permissible Bank Finance (MPBF)" value={inr(calc.tandonMethod2Mpbf)} auto />
              <Row label="Required Net Working Capital (25% of CA)" value={inr(calc.tandonMethod2Nwc)} last auto />
            </Card>

            <Card title="Turnover Method (Nayak Committee)">
              <Field label="Projected Annual Turnover — override" help="Defaults to Year 2 (Projected) Sales from Step 4 — not last year's actual — since repayment happens from future performance. Override if your own turnover estimate differs. / डिफ़ॉल्ट रूप से वर्ष 2 (अनुमानित) बिक्री; पिछले वर्ष की वास्तविक बिक्री नहीं। भिन्न होने पर बदलें।">
                <NumInput value={projectedTurnoverOverride} onChange={setProjectedTurnoverOverride} />
              </Field>
              <p className="text-xs text-stone-600 -mt-2 mb-2">Using: {inr(calc.projectedTurnover)} (Year 2 Projected Sales) unless overridden.</p>
              <Row label="Working Capital Requirement (25% of turnover)" value={inr(calc.turnoverWcRequirement)} auto />
              <Row label="Borrower's Margin (5% of turnover)" value={inr(calc.turnoverMargin)} auto />
              <Row label="Bank Finance (20% of turnover)" value={inr(calc.turnoverBankFinance)} bold last auto />
            </Card>
            <Banner tone="warn">
              Turnover Method typically applies for limits up to ₹5 crore (most SHG enterprise loans); Tandon Method is used for larger working capital limits. Use these figures to set the Working Capital Loan Amount in Step 2 (Enterprise & Loan → F2).
            </Banner>
          </section>
        )}

        {step === 3 && (
          <section>
            <h2 className="serif text-xl font-bold mb-1">I. Future Business Projections</h2>
            <p className="text-sm text-stone-600 mb-4">Current year figures are auto-linked from Financials. Enter growth % for Year 2 & 3.</p>
            <Card title="Current Year (Actual, auto)">
              <Row label="Sales" value={inr(calc.totalSales)} auto />
              <Row label="Purchases / COGS" value={inr(calc.totalPurchases)} auto />
              <Row label="Operating Expenditure" value={inr(calc.totalExpenditure - calc.totalPurchases)} auto />
              <Row label="Net Profit / (Loss)" value={inr(calc.netProfitY1)} last auto />
            </Card>
            <Field label="Sales Growth % – Year 2"><NumInput prefix="%" value={proj.growthSalesY2} onChange={(v) => setProj({ ...proj, growthSalesY2: v })} /></Field>
            <Field label="Sales Growth % – Year 3"><NumInput prefix="%" value={proj.growthSalesY3} onChange={(v) => setProj({ ...proj, growthSalesY3: v })} /></Field>
            <Field label="Operating Expenditure Growth % – Year 2"><NumInput prefix="%" value={proj.growthOpexY2} onChange={(v) => setProj({ ...proj, growthOpexY2: v })} /></Field>
            <Field label="Operating Expenditure Growth % – Year 3"><NumInput prefix="%" value={proj.growthOpexY3} onChange={(v) => setProj({ ...proj, growthOpexY3: v })} /></Field>

            <Card title="Year 2 (Projected, auto)">
              <Row label="Sales" value={inr(calc.salesY2)} />
              <Row label="Purchases / COGS" value={inr(calc.cogsY2)} auto />
              <Row label="Operating Expenditure" value={inr(calc.opexY2)} auto />
              <Row label="Net Profit / (Loss)" value={inr(calc.netProfitY2)} last auto />
            </Card>
            <Card title="Year 3 (Projected, auto)">
              <Row label="Sales" value={inr(calc.salesY3)} />
              <Row label="Purchases / COGS" value={inr(calc.cogsY3)} auto />
              <Row label="Operating Expenditure" value={inr(calc.opexY3)} auto />
              <Row label="Net Profit / (Loss)" value={inr(calc.netProfitY3)} last auto />
            </Card>
            <Banner tone="warn">
              The original workbook's Projections and Surplus rows didn't recompute from Year 2/3 inputs — this prototype fixes that so all three years respond to the growth assumptions above.
            </Banner>
          </section>
        )}

        {step === 4 && (
          <section>
            <h2 className="serif text-xl font-bold mb-1">K. Household Information</h2>
            <SubHeading>K1. Household Profile / पारिवारिक प्रोफ़ाइल</SubHeading>
            <FieldGrid fields={K1_FIELDS} obj={k1} setObj={setK1} />

            <SubHeading>K2. Household Income / पारिवारिक आय (वार्षिक)</SubHeading>
            <NumList
              fields={K2_INCOME_FIELDS}
              obj={hhInc}
              setObj={setHhInc}
              extraRow={{ label: "Income from Business (auto-linked to Year 2 Projected Net Profit, not last year's actual)", value: inr(calc.businessProfitLinked) }}
            />

            <SubHeading>K2. Household Expenditure / पारिवारिक व्यय (वार्षिक)</SubHeading>
            <NumList
              fields={K2_EXPENDITURE_FIELDS}
              obj={hhExp}
              setObj={setHhExp}
              extraRows={[
                { label: "EMI – SHG Loan (auto, from Section E)", value: inr(num(credit.shgEmi) * 12) },
                { label: "EMI – Bank Loan (auto, from Section E)", value: inr(num(credit.bankLoanEmi) * 12) },
                { label: "EMI – Informal Loan (auto, from Section E)", value: inr(num(credit.informalLoanEmi) * 12) },
              ]}
            />

            <Card title="Household Summary (auto)">
              <Row label="Total Household Income (A)" value={inr(calc.hhIncomeTotalWithBiz)} auto />
              <Row label="Total Household Expenditure (B)" value={inr(calc.hhExpTotal)} auto />
              <Row label="Household Surplus (A − B), annual" value={inr(calc.householdSurplusAnnual)} bold last auto />
            </Card>
            {calc.monthlyHouseholdSurplus < 0 && <Banner tone="warn">Household expenses exceed income before any new loan — this will limit eligibility.</Banner>}

            <SubHeading>K3. Loan EMI Repayment Schedule / ऋण ईएमआई अनुसूची (मासिक)</SubHeading>
            <Card>
              <Row label="EMI – SHG Loan (auto)" value={inr(calc.existingEmiShg)} auto />
              <Row label="EMI – Existing Bank Loan (auto)" value={inr(num(credit.bankLoanEmi))} auto />
              <Row label="EMI – Informal Loan (auto)" value={inr(num(credit.informalLoanEmi))} auto />
              <Row label="EMI – Proposed New Loan (as declared)" value={inr(num(loanF.proposedEmi))} />
              <Row label="TOTAL MONTHLY EMI" value={inr(calc.totalMonthlyEmi)} bold auto />
              <Row label="Net Cash Surplus After All EMIs" value={inr(calc.netCashSurplusAfterAllEmis)} bold last auto />
            </Card>
          </section>
        )}

        {step === 5 && (
          <section>
            <h2 className="serif text-xl font-bold mb-1">L. Loan Repayment Feasibility</h2>
            <SubHeading>L1. Input Data / इनपुट डेटा</SubHeading>
            <Card>
              <Row label="Proposed Term Loan Amount (auto, EMI basis)" value={inr(calc.tlAmount)} />
              <Row label="Moratorium Period (auto, from F3)" value={`${calc.moratoriumMonths} months`} />
              <Row label="Repayment Period (auto)" value={`${loanF.tenureMonths} months`} />
              <Row label="Annual Interest Rate (auto)" value={pct(num(loanF.interestRate))} last />
            </Card>
            {calc.moratoriumMonths > 0 && (
              <Banner tone="warn">
                Interest accrues during the {calc.moratoriumMonths}-month moratorium and is added to the loan — EMI is calculated on {inr(calc.tlPrincipalAfterMoratorium)} (not the original {inr(calc.tlAmount)}), once repayment starts. / अधिस्थगन के दौरान ब्याज जुड़ता है, ईएमआई बढ़ी हुई राशि पर गणना होती है।
              </Banner>
            )}
            <Field label="Monthly Household Income – override" help="Defaults to the Household step's figure; override if needed. / डिफ़ॉल्ट रूप से पारिवारिक चरण का आंकड़ा; आवश्यकता होने पर बदलें।">
              <NumInput value={emiL1.monthlyHHIncomeOverride} onChange={(v) => setEmiL1({ ...emiL1, monthlyHHIncomeOverride: v })} />
            </Field>
            <p className="text-xs text-stone-600 -mt-2 mb-3">Using: {inr(calc.monthlyHHIncome)} unless overridden.</p>
            <Field label="Monthly Household Expenditure – override">
              <NumInput value={emiL1.monthlyHHExpenditureOverride} onChange={(v) => setEmiL1({ ...emiL1, monthlyHHExpenditureOverride: v })} />
            </Field>
            <p className="text-xs text-stone-600 -mt-2 mb-3">Using: {inr(calc.emiMonthlyHHExpenditureExclEmi)} unless overridden (household expenditure excluding existing EMIs, since those are added back separately below — avoids double-counting).</p>
            <Field label="Existing Monthly EMI – Bank / Other – override">
              <NumInput value={emiL1.existingEmiBankOverride} onChange={(v) => setEmiL1({ ...emiL1, existingEmiBankOverride: v })} />
            </Field>
            <p className="text-xs text-stone-600 -mt-2 mb-3">Existing EMI – SHG (auto): {inr(calc.existingEmiShg)} · Informal Loan (auto): {inr(calc.existingEmiInformal)}</p>

            <SubHeading>L2. Auto-Calculated EMI & Feasibility / स्वतः गणना की गई ईएमआई</SubHeading>
            <Card>
              <Row label="Calculated Monthly EMI on Proposed Loan (PMT)" value={inr(calc.calculatedEmi)} auto />
              <Row label="Total Existing Monthly EMIs" value={inr(calc.totalExistingEmi)} auto />
              <Row label="Monthly Surplus BEFORE New EMI" value={inr(calc.surplusBeforeNewEmi)} auto />
              <Row label="Surplus AFTER New EMI" value={inr(calc.surplusAfterNewEmi)} bold auto />
              <Row
                label="DSCR"
                value={calc.dscr.toFixed(2)}
                auto
                help="Debt Service Coverage Ratio — how many times your available surplus (household + business, after existing EMIs) can cover the total EMI obligation. Up to 1.5 is the recommended threshold — that's what determines the app's recommendation. / ऋण सेवा कवरेज अनुपात — 1.5 तक की सिफारिश की जाती है।"
              />
              <Row
                label="FOIR"
                value={pct(calc.foir)}
                last
                auto
                help="Fixed Obligation to Income Ratio — the % of monthly household income already committed to EMIs (existing + this proposed loan). Banks generally prefer this to stay under 50%; above that, the household is considered over-leveraged. / निश्चित दायित्व-आय अनुपात — बैंक आमतौर पर इसे 50% से नीचे रखना पसंद करते हैं।"
              />
            </Card>
            <p className="text-xs text-stone-600 mb-3">
              <span className="font-semibold">FOIR</span> = % of monthly household income already going to EMIs (existing + this loan) — banks want this under 50%. <span className="font-semibold">DSCR</span> = how many times your surplus can cover the EMI — up to 1.5 is the recommended threshold, and determines the recommendation below. / एफओआईआर 50% से कम व डीएससीआर 1.5 तक होना सिफारिश हेतु आवश्यक है।
            </p>
            {calc.surplusAfterNewEmi < 0 ? (
              <Banner tone="danger">Not viable at the requested terms — shortfall of {inr(Math.abs(calc.surplusAfterNewEmi))}. See suggestions below.</Banner>
            ) : (
              <Banner tone="ok">Viable — surplus of {inr(calc.surplusAfterNewEmi)} remains after the new EMI.</Banner>
            )}

            <SubHeading>L3. Smart Suggestions / स्मार्ट सुझाव</SubHeading>
            <p className="text-xs text-stone-600 mb-2">Safe EMI capacity = 50% of surplus before new EMI (buffer for household emergencies).</p>
            <Card>
              <Row label="Safe Monthly EMI Capacity" value={inr(calc.safeEmiCapacity)} last auto />
            </Card>
            <Card title="Suggestion A — Maximum Loan Affordable (same tenure & rate)">
              <Row label="Maximum Loan Amount that can be Sanctioned" value={inr(calc.maxEligibleLoan)} last auto />
            </Card>
            <Card title="Suggestion B — Minimum Tenure Required (same loan amount & rate)">
              <Row label="Minimum Tenure Required" value={calc.minTenureMonths ? `${calc.minTenureMonths} months` : "Not achievable at this EMI capacity"} last auto />
            </Card>
            {calc.recommendation === "Not Recommended" && (
              calc.minTenureMonths && calc.minTenureMonths <= 60 ? (
                <Banner tone="warn">
                  Suggestion: this loan becomes viable if the repayment period is extended to about {calc.minTenureMonths} months (within the 60-month maximum), instead of the current {loanF.tenureMonths} months — this can be edited on Step 2 after review, if needed. / सुझाव: पुनर्भुगतान अवधि लगभग {calc.minTenureMonths} महीने करने पर यह ऋण व्यवहार्य हो सकता है।
                </Banner>
              ) : (
                <Banner tone="danger">
                  Even extending the repayment period to 60 months (the maximum) would not make this loan viable at the current EMI capacity — the loan amount itself needs to be reduced, or household/business surplus needs to improve. / 60 महीने तक बढ़ाने पर भी यह ऋण व्यवहार्य नहीं होगा — ऋण राशि घटानी होगी।
                </Banner>
              )
            )}
          </section>
        )}

        {step === 6 && (
          <>
            <div className="no-print grid grid-cols-2 gap-2 mb-3">
              <button onClick={() => setFsOpen(true)} className="flex items-center justify-center gap-1.5 px-2 py-2.5 rounded-md bg-emerald-900 text-stone-50 text-xs font-semibold">
                <Icon name="description" size={15}  /> Financial Statements
              </button>
              <button onClick={() => setClafOpen(true)} className="flex items-center justify-center gap-1.5 px-2 py-2.5 rounded-md bg-amber-600 text-white text-xs font-semibold">
                <Icon name="account_balance" size={15}  /> Loan Application Form
              </button>
            </div>
            <Report identity={identity} enterprise={enterprise} credit={credit} h2={h2} h3={h3} loanF={loanF} wc={wc} tl={tl} openingStock={openingStock} govtSubsidy={govtSubsidy} proj={proj} calc={calc} />
            <div className="mt-4 no-print space-y-2">
              <p className="text-xs font-semibold text-stone-600 uppercase tracking-wide">Documents for bank submission</p>
              <button onClick={() => setFsOpen(true)} className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-md bg-emerald-900 text-stone-50 text-sm font-semibold">
                <Icon name="description" size={16}  /> Financial Statements for Bank (full, 8 sections) / बैंक हेतु पूर्ण वित्तीय विवरण
              </button>
              <button onClick={() => setClafOpen(true)} className="w-full flex items-center justify-center gap-2 px-4 py-3 rounded-md border-2 border-amber-600 text-amber-700 text-sm font-semibold">
                <Icon name="account_balance" size={16}  /> Common Loan Application (IBA Form) / ऋण आवेदन पत्र
              </button>
            </div>
            <div className="mt-4 no-print space-y-2">
              <p className="text-xs font-semibold text-stone-600 uppercase tracking-wide">P&L & Balance Sheet only (separate statements, for bank submission)</p>
              <div className="grid grid-cols-3 gap-2">
                <button onClick={() => downloadPLBSPdf("share")} disabled={plbsBusy} className="flex flex-col items-center justify-center gap-1 px-2 py-2 rounded-md bg-emerald-900 text-stone-50 text-xs font-semibold disabled:opacity-40">
                  {plbsBusy ? <Icon name="progress_activity" size={16} className="animate-spin"  /> : <Icon name="share" size={16}  />} Share
                </button>
                <button onClick={() => downloadPLBSPdf("download")} disabled={plbsBusy} className="flex flex-col items-center justify-center gap-1 px-2 py-2 rounded-md border border-emerald-900 text-emerald-900 text-xs font-semibold disabled:opacity-40">
                  <Icon name="download" size={16}  /> Download
                </button>
                <button onClick={() => downloadPLBSPdf("print")} disabled={plbsBusy} className="flex flex-col items-center justify-center gap-1 px-2 py-2 rounded-md border border-amber-600 text-amber-700 text-xs font-semibold disabled:opacity-40">
                  <Icon name="print" size={16}  /> Print
                </button>
              </div>
              {plbsStatus === "shared" && <p className="text-xs text-green-800">Shared successfully via your phone's share sheet.</p>}
              {plbsStatus === "downloaded" && <p className="text-xs text-stone-600">PDF downloaded — share it from your Files/Downloads app.</p>}
              {plbsStatus === "print-opened" && <p className="text-xs text-stone-600">Opened in a new tab — use your browser/PDF viewer's print button.</p>}
              {plbsStatus === "popup-blocked" && <p className="text-xs text-red-700">Your browser blocked the new tab — allow pop-ups for this site and try Print again.</p>}
              {plbsStatus === "pdf-unavailable" && <p className="text-xs text-red-700">Couldn't load the PDF tool (needs an internet connection).</p>}
              {plbsStatus === "error" && <p className="text-xs text-red-700">Something went wrong — please try again.</p>}
            </div>
            <div className="mt-4 no-print space-y-2">
              <div className="flex gap-2">
                <button onClick={shareAsText} className="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-md border border-emerald-900 text-emerald-900 text-sm font-semibold">
                  <Icon name="share" size={16}  /> Share / साझा करें
                </button>
                <button onClick={shareAsPdf} disabled={pdfBusy} className="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-md border border-amber-600 text-amber-700 text-sm font-semibold disabled:opacity-40">
                  {pdfBusy ? <Icon name="progress_activity" size={16} className="animate-spin"  /> : <Icon name="download" size={16}  />} Share PDF / पीडीएफ साझा करें
                </button>
              </div>
              {shareStatus === "shared" && <p className="text-xs text-green-800">Shared successfully via your phone's share sheet.</p>}
              {shareStatus === "copied" && <p className="text-xs text-stone-600">Sharing isn't available here, so the summary was copied to your clipboard instead — paste it into WhatsApp, SMS, or email.</p>}
              {shareStatus === "downloaded" && <p className="text-xs text-stone-600">PDF downloaded to your device — share it from your Files/Downloads app.</p>}
              {shareStatus === "pdf-unavailable" && <p className="text-xs text-red-700">Couldn't load the PDF tool (needs an internet connection). Try "Share" (text) instead, or use Print Report below.</p>}
              {shareStatus === "error" && <p className="text-xs text-red-700">Something went wrong — please try again.</p>}

              <Banner tone="warn">This saves a summary (names, loan figures, DSCR/FOIR, recommendation) on this device only, so you can review past applications later. To send it to a BPM, use Share / Share PDF above.</Banner>
              <button onClick={submitToBPM} className="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-md bg-emerald-900 text-stone-50 text-sm font-semibold">
                <Icon name="send" size={16}  /> Save Submission (this device)
              </button>
              {submitStatus === "saving" && <p className="text-xs text-stone-600 mt-2">Saving…</p>}
              {submitStatus === "saved" && <p className="text-xs text-green-800 mt-2">Saved — visible under the Submissions icon (👥) in the header, on this device.</p>}
              {submitStatus === "error" && <p className="text-xs text-red-700 mt-2">Couldn't share — please try again.</p>}
            </div>
          </>
        )}
      </div>

      <div className="fixed bottom-0 left-0 right-0 bg-stone-100 border-t border-stone-300 px-4 py-3 no-print">
        <div className="max-w-md mx-auto">
          {hardBlockReason() && <p className="text-xs text-red-700 font-semibold mb-2">{hardBlockReason()}</p>}
          {!hardBlockReason() && step < STEPS.length - 1 && missingRequired().length > 0 && (
            <p className="text-xs text-amber-800 mb-2">Not filled yet / अभी भरा नहीं गया: {missingRequired().join(", ")} — you can still continue and fill these later. / आप बाद में भी भर सकते हैं।</p>
          )}
          <div className="flex gap-3">
            {step > 0 && (
              <button onClick={() => setStep(step - 1)} className="flex items-center gap-1 px-4 py-2 rounded-md border border-stone-400 text-emerald-900 text-sm font-medium">
                <Icon name="chevron_left" size={16}  /> Back / पीछे
              </button>
            )}
            {step < STEPS.length - 1 ? (
              <button
                onClick={() => setStep(step + 1)}
                disabled={!!hardBlockReason()}
                className="flex-1 flex items-center justify-center gap-1 px-4 py-2 rounded-md bg-emerald-900 text-stone-50 text-sm font-semibold disabled:opacity-40"
              >
                Next / आगे <Icon name="chevron_right" size={16}  />
              </button>
            ) : (
              <button onClick={() => window.print()} className="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-md bg-amber-600 text-white text-sm font-semibold">
                <Icon name="print" size={16}  /> Print Report / रिपोर्ट प्रिंट करें
              </button>
            )}
          </div>
        </div>
      </div>

      <button
        onClick={() => setChatOpen(true)}
        className="no-print fixed bottom-24 right-4 pl-3 pr-4 py-2.5 rounded-full bg-amber-600 text-white shadow-lg flex items-center gap-2 z-30"
        aria-label="Ask a question"
      >
        <Icon name="chat" size={18}  />
        <span className="text-sm font-semibold">Ask a question</span>
      </button>

      <ChatWidget open={chatOpen} onClose={() => setChatOpen(false)} contextSummary={contextSummary} step={step} issues={issues} />
      <DiagnosticsPanel open={diagOpen} onClose={() => setDiagOpen(false)} issues={issues} />
      {helpOpen && <IelaHelpModal onClose={() => setHelpOpen(false)} />}
      {pcOpen && <PracticeImportModal onClose={() => setPcOpen(false)} onApply={importPracticeCase} practice={practice} getCurrentPayload={buildDataPayload} />}
      <BPMPanel open={bpmOpen} onClose={() => setBpmOpen(false)} submissions={submissions} loading={submissionsLoading} error={submissionsError} onRefresh={loadSubmissions} />
      <FinancialStatementsPanel
        open={fsOpen}
        onClose={() => setFsOpen(false)}
        identity={identity}
        enterprise={enterprise}
        loanF={loanF}
        proj={proj}
        openingStock={openingStock}
        govtSubsidy={govtSubsidy}
        credit={credit}
        h2={h2}
        h3={h3}
        calc={calc}
        onDownload={downloadFinancialStatementPdf}
        busy={fsBusy}
        status={fsStatus}
      />
      <LoanApplicationPanel
        open={clafOpen}
        onClose={() => setClafOpen(false)}
        identity={identity}
        enterprise={enterprise}
        credit={credit}
        wc={wc}
        tl={tl}
        loanF={loanF}
        k1={k1}
        calc={calc}
        onDownload={downloadLoanApplicationPdf}
        busy={clafBusy}
        status={clafStatus}
      />
    </div>
  );
}

function Stamp({ recommendation, tone }) {
  const color = tone === "ok" ? "#4C7A51" : tone === "warn" ? "#C08A2E" : "#A63D40";
  return (
    <div className="w-28 h-28 rounded-full border-4 flex items-center justify-center text-center p-2 mx-auto" style={{ borderColor: color, color, transform: "rotate(-8deg)" }}>
      <span className="serif font-bold text-xs leading-tight uppercase">{recommendation}</span>
    </div>
  );
}

function Report({ identity, enterprise, credit, h2, h3, loanF, wc, tl, openingStock, govtSubsidy, proj, calc }) {
  const ledger = buildTradingPLLedger(calc, openingStock, govtSubsidy, h2);
  const bsActual = buildBalanceSheetBreakup(calc, credit, h3);
  const bsY2 = buildBalanceSheetBreakupY2(calc);
  return (
    <div className="print-area bg-white border border-stone-300 rounded-lg p-5 shadow-sm">
      <div className="text-center mb-4">
        <p className="text-xs tracking-widest text-stone-500 uppercase">Financial Statements for Bank Loan Appraisal</p>
        <h2 className="serif text-lg font-bold mt-1">{enterprise.enterpriseName || "Enterprise Name"}</h2>
        <p className="text-xs text-stone-600">{identity.memberName} · {identity.shgName}</p>
        <p className="text-xs text-amber-700 italic mt-0.5">DAY-NRLM Enterprise Loan — Annexure III Business Analysis</p>
      </div>

      <SubHeading>1. Applicant & Enterprise Details / आवेदक व उद्यम विवरण</SubHeading>
      <Row label="SHG / Member" value={`${identity.shgName || "—"} / ${identity.memberName || "—"}`} />
      <Row label="Enterprise" value={enterprise.enterpriseName || "—"} />
      <Row label="Business Activity" value={enterprise.currentActivity || "—"} />
      <Row label="Business Start Date" value={enterprise.startDate || "—"} />
      <Row label="Experience" value={`${enterprise.experience || 0} yrs`} />
      <Row label="Bank & Branch" value={`${identity.bankName || "—"}, ${identity.branchName || "—"}`} last />

      <SubHeading>2. Trading Account — Last Year (Actual) / व्यापार खाता (पिछला वर्ष)</SubHeading>
      <LedgerAccount title="Trading Account" dr={ledger.trading.dr} cr={ledger.trading.cr} />

      <SubHeading>Profit & Loss Account — Last Year (Actual) / लाभ-हानि खाता (पिछला वर्ष)</SubHeading>
      <LedgerAccount title="Profit & Loss Account" dr={ledger.pl.dr} cr={ledger.pl.cr} />
      <p className="text-xs text-stone-500 italic mt-1 mb-2">Gross Margin {pct(calc.grossMargin)} · Net Margin {pct(calc.netMargin)} · Includes actual interest paid — SHG {inr(calc.interestShgFinal)}, Bank {inr(calc.interestBankFinal)}, Informal {inr(calc.interestInformalFinal)}.</p>

      <SubHeading>3. Balance Sheet — Last Year (Actual) / तुलन पत्र (पिछला वर्ष)</SubHeading>
      <BalanceSheetBreakupTable title="Balance Sheet (Last Year Actual)" liabSections={bsActual.liabSections} assetSections={bsActual.assetSections} />
      <p className="text-xs text-stone-500 italic mt-1 mb-2">Balance Sheet tallies: Assets {inr(calc.totalAssets)} = Liabilities {inr(calc.totalLiabilities)}.</p>

      <SubHeading>Balance Sheet — Projected (Year 2, with loan facilities applied) / तुलन पत्र — अनुमानित (वर्ष 2)</SubHeading>
      <BalanceSheetBreakupTable
        title="Balance Sheet (Year 2 Projected)"
        liabSections={bsY2.liabSections}
        assetSections={bsY2.assetSections}
        note="Category totals only — Year 2 is a simplified one-year projection, not itemised like the Actual year above. Owner's Capital = Last Year Capital + Year 2 retained profit; Long-Term Liabilities = existing Bank Term Loan + recommended new Term Loan; Fixed Assets = Last Year + new asset funded by this Term Loan."
      />
      {calc.bsMismatchY2Flag ? (
        <Banner tone="warn">
          Balance Sheet Mismatch: Total Assets ({inr(calc.totalAssetsY2)}) do not equal Capital + Liabilities ({inr(calc.totalLiabilitiesY2)}) — a difference of {inr(Math.abs(calc.bsMismatchY2))}. This is expected in a simplified 1-year projection (Capital here is rolled forward from Last Year's actual figure, not plugged) — see Health Check for details. The Last Year Actual sheet above is unaffected and still tallies exactly.
        </Banner>
      ) : (
        <p className="text-xs text-stone-500 italic mt-1 mb-2">
          Balance Sheet tallies: Assets {inr(calc.totalAssetsY2)} = Liabilities {inr(calc.totalLiabilitiesY2)}. Estimated — existing SHG/Bank/Informal loan balances are carried forward unchanged (no amortization schedule assumed); the recommended Term Loan ({inr(calc.recommendedTermLoan)}) is added as newly disbursed and applied to fund the new asset.
        </p>
      )}

      <SubHeading>4. Working Capital Assessment / कार्यशील पूंजी मूल्यांकन</SubHeading>
      <Row label="Projected Annual Turnover (Year 2)" value={inr(calc.projectedTurnover)} auto />
      <Row label="— Working Capital Requirement (25%)" value={inr(calc.turnoverWcRequirement)} auto />
      <Row label="— Borrower's Margin (5%)" value={inr(calc.turnoverMargin)} auto />
      <Row label="— Bank Finance (20%)" value={inr(calc.turnoverBankFinance)} bold auto />
      <Row label="Tandon Method I — MPBF" value={inr(calc.tandonMethod1Mpbf)} auto />
      <Row label="Tandon Method II — MPBF" value={inr(calc.tandonMethod2Mpbf)} auto />
      <Row label="Working Capital / CC Requested" value={inr(calc.wcLoanAmount)} />
      <Row label="Recommended Working Capital / CC Limit" value={inr(calc.recommendedWc)} bold auto last />
      <p className="text-xs text-stone-500 italic mt-1 mb-2">
        {calc.wcWasReduced
          ? `Reduced from ${inr(calc.wcLoanAmount)} requested to ${inr(calc.recommendedWc)} — capped at the higher of Tandon Method II (${inr(calc.tandonMethod2Mpbf)}) and the Turnover Method (${inr(calc.turnoverBankFinance)}).`
          : `The full amount requested (${inr(calc.wcLoanAmount)}) is within the assessed eligibility.`}
      </p>

      <SubHeading>5. Trading & P&L — 3-Year Comparison / 3-वर्षीय तुलना</SubHeading>
      <div className="overflow-x-auto -mx-1">
        <table className="w-full text-xs border-collapse min-w-[420px]">
          <thead>
            <tr className="bg-emerald-900 text-stone-50">
              <th className="text-left px-2 py-1.5 font-semibold">Particulars</th>
              <th className="text-right px-2 py-1.5 font-semibold">Last Year</th>
              <th className="text-right px-2 py-1.5 font-semibold">Year 2</th>
              <th className="text-right px-2 py-1.5 font-semibold">Year 3</th>
            </tr>
          </thead>
          <tbody className="text-stone-800">
            <tr className="border-b border-stone-200"><td className="px-2 py-1.5">Sales</td><td className="text-right px-2 py-1.5 font-mono">{inr(calc.totalSales)}</td><td className="text-right px-2 py-1.5 font-mono text-red-700">{inr(calc.salesY2)}</td><td className="text-right px-2 py-1.5 font-mono text-red-700">{inr(calc.salesY3)}</td></tr>
            <tr className="border-b border-stone-200"><td className="px-2 py-1.5">Purchases / COGS</td><td className="text-right px-2 py-1.5 font-mono">{inr(calc.totalPurchases)}</td><td className="text-right px-2 py-1.5 font-mono text-red-700">{inr(calc.cogsY2)}</td><td className="text-right px-2 py-1.5 font-mono text-red-700">{inr(calc.cogsY3)}</td></tr>
            <tr className="border-b border-stone-200 font-semibold"><td className="px-2 py-1.5">Net Profit / (Loss)</td><td className="text-right px-2 py-1.5 font-mono">{inr(calc.netProfitY1)}</td><td className="text-right px-2 py-1.5 font-mono text-red-700">{inr(calc.netProfitY2)}</td><td className="text-right px-2 py-1.5 font-mono text-red-700">{inr(calc.netProfitY3)}</td></tr>
          </tbody>
        </table>
      </div>
      <p className="text-xs text-stone-500 italic mt-1 mb-2">Growth assumptions: Sales +{proj.growthSalesY2}% (Yr2), +{proj.growthSalesY3}% (Yr3); Opex +{proj.growthOpexY2}% (Yr2), +{proj.growthOpexY3}% (Yr3).</p>

      <SubHeading>6. Proposed Loan Summary / प्रस्तावित ऋण सारांश</SubHeading>
      <Row label="Total Project Cost" value={inr(calc.totalProjectCost)} auto />
      <Row label="Margin Money" value={inr(calc.marginMoneyDerived)} auto />
      <Row label="Working Capital Loan Requested" value={inr(calc.wcLoanAmount)} />
      <Row label="Term Loan Amount Requested" value={inr(calc.tlAmount)} />
      <Row label="Total Loan Requested" value={inr(calc.totalLoanRequested)} bold auto />
      <Row label="Term Loan Tenure" value={`${loanF.tenureMonths} months`} />
      <Row label="Interest Rate (Term Loan)" value={`${loanF.interestRate}% p.a.`} />
      <Row label="Recommended Term Loan" value={inr(calc.recommendedTermLoan)} bold auto />
      <Row label="EMI on Recommended Term Loan" value={inr(pmt(calc.recommendedTermLoan, loanF.interestRate, loanF.tenureMonths))} last auto />
      <p className="text-xs text-stone-500 italic mt-1 mb-2">
        {calc.termLoanWasReduced
          ? `Reduced from ${inr(calc.tlAmount)} requested to ${inr(calc.recommendedTermLoan)} — the maximum the household's repayment capacity supports (DSCR up to 1.5 is the recommended threshold).`
          : `The full amount requested (${inr(calc.tlAmount)}) is within the assessed eligibility.`}
      </p>

      <SubHeading>7. Household Assessment & Repayment Capacity / पारिवारिक मूल्यांकन</SubHeading>
      <Row label="Monthly Household Income (incl. Year 2 projected business profit)" value={inr(calc.monthlyHHIncome)} />
      <Row label="Monthly Household Expenditure" value={inr(calc.monthlyHHExpenditure)} />
      <Row label="Monthly Household Surplus" value={inr(calc.monthlyHouseholdSurplus)} auto />
      <Row label="DSCR (Debt Service Coverage Ratio)" value={`${calc.dscr.toFixed(2)} — ${calc.dscrLabel}`} bold auto />
      <Row label="FOIR (Fixed Obligation to Income Ratio)" value={pct(calc.foir)} last auto />

      <SubHeading>Proposed Facilities / प्रस्तावित सुविधाएं</SubHeading>
      <p className="text-sm font-semibold text-stone-800 mb-2">
        Proposed facilities:- Term Loan {inr(calc.recommendedTermLoan)}&nbsp;&nbsp;&nbsp;Cash Credit {inr(calc.recommendedWc)}
      </p>
      <ul className="text-sm space-y-1.5 list-disc pl-4 text-stone-800">
        {calc.netProfit >= 0 ? (
          <li>Your business generates a net profit of {inr(calc.netProfit)} a year, supporting repayment capacity.</li>
        ) : (
          <li>Your business shows a net loss this year — repayment capacity is weak until this improves.</li>
        )}
        {calc.ownersCapital < 0 && <li>Owner's capital works out negative — liabilities other than capital exceed total assets; treat this report as provisional until resolved.</li>}
        {calc.monthlyHouseholdSurplus < 0 && <li>Household expenses currently exceed income; reducing expenses will improve eligibility.</li>}
        <li>
          {calc.termLoanWasReduced && calc.recommendedTermLoan > 0 ? (
            <>Applied for <span className="font-semibold">{inr(calc.tlAmount)}</span> — as per income/repayment capacity, <span className="font-semibold">{inr(calc.recommendedTermLoan)}</span> with EMI of {inr(pmt(calc.recommendedTermLoan, loanF.interestRate, loanF.tenureMonths))} may be approved instead.</>
          ) : calc.termLoanWasReduced && calc.recommendedTermLoan <= 0 ? (
            <>Applied for <span className="font-semibold">{inr(calc.tlAmount)}</span> — as per current income/repayment capacity, no Term Loan amount can be safely supported at this time.</>
          ) : (
            <>The full Term Loan amount requested (<span className="font-semibold">{inr(calc.tlAmount)}</span>) may be approved, with EMI of {inr(pmt(calc.recommendedTermLoan, loanF.interestRate, loanF.tenureMonths))}.</>
          )}
        </li>
        <li>
          {calc.wcWasReduced ? (
            <>Applied for Working Capital/CC of <span className="font-semibold">{inr(calc.wcLoanAmount)}</span> — as per the Tandon/Turnover method ceiling of {inr(calc.wcEligibleLimit)}, <span className="font-semibold">{inr(calc.recommendedWc)}</span> may be approved instead.</>
          ) : (
            <>The full Working Capital/CC amount requested (<span className="font-semibold">{inr(calc.wcLoanAmount)}</span>) may be approved.</>
          )}
        </li>
        {calc.recommendation === "Not Recommended" && calc.recommendedTermLoan <= 0 && calc.minTenureMonths && calc.minTenureMonths <= 60 && (
          <li>Alternative: extending the repayment period to about {calc.minTenureMonths} months (within the 60-month maximum) could make a Term Loan viable at the current EMI capacity — editable on Step 2 if the applicant agrees.</li>
        )}
        <li>FOIR is {pct(calc.foir)} — {calc.foir <= 50 ? "within acceptable banking norms." : "above typical banking comfort levels (50%)."}</li>
      </ul>

      <p className="text-xs text-stone-600 mt-6">Prepared by: _____________________&nbsp;&nbsp;&nbsp;Vitta Sakhi / BPM</p>
      <p className="text-xs text-stone-600 mt-2">Reviewed by: _____________________&nbsp;&nbsp;&nbsp;BPM</p>
      <p className="text-xs text-stone-600 mt-2">Date: _____________________</p>
      <p className="text-center text-xs text-stone-400 mt-6 pt-3 border-t border-stone-200">Developed by Anil Sharma, former General Manager, Central Bank of India · v{APP_VERSION}</p>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  function showBootError(title, message, detail) {
    var root = document.getElementById("root");
    root.innerHTML =
      '<div style="padding:20px;font-family:sans-serif;color:#7c2b2d;background:#fef2f2;min-height:100vh;">' +
      '<h2 style="margin-top:0;">' + title + '</h2>' +
      '<p style="white-space:pre-wrap;">' + (message || "Unknown error") + '</p>' +
      (detail ? '<pre style="font-size:11px;color:#994444;white-space:pre-wrap;overflow:auto;border-top:1px solid #f3c4c4;padding-top:10px;">' + detail + '</pre>' : "") +
      '<p style="font-size:12px;color:#777;margin-top:16px;">If you\'re the developer: open this page\'s browser console (or Safari/Chrome remote inspector) for the full stack trace.</p>' +
      '</div>';
  }

  window.addEventListener("error", function (e) {
    var root = document.getElementById("root");
    if (root && !root.hasAttribute("data-app-loaded")) {
      showBootError("Something went wrong", e.message, e.error && e.error.stack);
    }
  });
  window.addEventListener("unhandledrejection", function (e) {
    var root = document.getElementById("root");
    if (root && !root.hasAttribute("data-app-loaded")) {
      showBootError("Something went wrong (async)", e.reason && e.reason.message ? e.reason.message : String(e.reason));
    }
  });

  (function boot() {
    if (typeof React === "undefined" || typeof ReactDOM === "undefined" || typeof Babel === "undefined") {
      var missing = [
        typeof React === "undefined" ? "React" : null,
        typeof ReactDOM === "undefined" ? "ReactDOM" : null,
        typeof Babel === "undefined" ? "Babel" : null,
      ].filter(Boolean).join(", ");
      showBootError(
        "Couldn't load required scripts",
        "This page needs " + missing + " to load from an external CDN (cdnjs.cloudflare.com), but it didn't arrive. This usually means no internet connection, or that CDN is blocked on this network/browser.",
        "Try: checking your internet connection, switching networks/Wi-Fi, or opening this page in a regular browser (Safari/Chrome) instead of an in-app preview."
      );
      return;
    }
    var source = document.getElementById("app-source").textContent;
    var transformed;
    try {
      transformed = Babel.transform(source, { presets: ["react"] }).code;
    } catch (compileErr) {
      showBootError("Couldn't load the app (code error)", compileErr.message, compileErr.stack);
      return;
    }
    try {
      (0, eval)(transformed);
      document.getElementById("root").setAttribute("data-app-loaded", "true");
    } catch (runtimeErr) {
      showBootError("Couldn't start the app (runtime error)", runtimeErr.message, runtimeErr.stack);
    }
  })();
</script>
