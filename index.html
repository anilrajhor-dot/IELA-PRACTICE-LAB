function pmt(principal, annualRatePct, months) {
  const r = (Number(annualRatePct) || 0) / 100 / 12;
  const p = Number(principal) || 0;
  const n = Number(months) || 0;
  if (!p || !n) return 0;
  if (r === 0) return p / n;
  const f = Math.pow(1 + r, n);
  return (p * r * f) / (f - 1);
}
function maxLoanFromEmi(emi, annualRatePct, months) {
  const r = (Number(annualRatePct) || 0) / 100 / 12;
  const e = Number(emi) || 0;
  const n = Number(months) || 0;
  if (!e || !n) return 0;
  if (r === 0) return e * n;
  const f = Math.pow(1 + r, n);
  return (e * (f - 1)) / (r * f);
}
function minTenure(principal, annualRatePct, emi) {
  const r = (Number(annualRatePct) || 0) / 100 / 12;
  const p = Number(principal) || 0;
  const e = Number(emi) || 0;
  if (!p || !e) return null;
  if (r === 0) return Math.ceil(p / e);
  if (e <= p * r) return null; // EMI can never cover interest — loan never pays off
  return Math.ceil(Math.log(e / (e - p * r)) / Math.log(1 + r));
}

const LocalStore = {
  async list(prefix) {
    const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
    return { keys };
  },
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error("not found");
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
};

function speakText(text, lang = "en-IN") {
  if (!window.speechSynthesis || text === "" || text === null || text === undefined) return;
  try {
    window.speechSynthesis.cancel(); // stop any speech already in progress
    const utter = new SpeechSynthesisUtterance(String(text));
    utter.lang = lang;
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  } catch (e) {
    // speech synthesis not available — silently skip, typing/reading still works
  }
}
function startVoiceInput(onResult, onError) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    onError && onError();
    return null;
  }
  const rec = new SR();
  rec.lang = "en-IN";
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = (e) => onResult(e.results[0][0].transcript);
  rec.onerror = () => onError && onError();
  rec.onend = () => onError && onError();
  rec.start();
  return rec;
}
function parseSpokenNumber(transcript) {
  // Speech engines usually transcribe clearly-spoken numbers as digits already (e.g. "5,000"); this just
  // strips commas/currency words and pulls out the numeric part.
  const cleaned = transcript.replace(/,/g, "").replace(/rupees?|rs\.?/gi, "").trim();
  const match = cleaned.match(/[\d.]+/);
  return match ? match[0] : "";
}

function NumInput({ value, onChange, prefix = "₹" }) {
  const [listening, setListening] = useState(false);
  const [micError, setMicError] = useState(false);
  const recRef = useRef(null);

  function toggleMic() {
    if (listening) {
      recRef.current && recRef.current.stop();
      setListening(false);
      return;
    }
    setMicError(false);
    const rec = startVoiceInput(
      (transcript) => {
        const num = parseSpokenNumber(transcript);
        if (num !== "") {
          onChange(num);
          speakText(num);
        }
        setListening(false);
      },
      () => setListening(false)
    );
    if (rec) {
      recRef.current = rec;
      setListening(true);
    } else {
      setMicError(true);
    }
  }

  return (
    <div>
      <div className="mt-1 flex items-center border border-stone-400 rounded-md bg-white focus-within:ring-2 focus-within:ring-amber-600">
        <span className="pl-3 text-stone-500 font-mono text-sm">{prefix}</span>
        <input
          type="number"
          value={value}
          onChange={(e) => onChange(e.target.value === "" ? "" : e.target.value)}
          className="w-full px-2 py-2 outline-none font-mono text-sm bg-transparent min-w-0"
          placeholder="0"
        />
        <button type="button" onClick={toggleMic} className={`px-2 py-2 shrink-0 ${listening ? "text-red-600 animate-pulse" : "text-stone-400"}`} aria-label="Speak to enter value">
          {listening ? <Icon name="mic_off" size={16}  /> : <Icon name="mic" size={16}  />}
        </button>
        <button type="button" onClick={() => speakText(value !== "" && value !== null && value !== undefined ? value : "empty")} className="pr-3 pl-1 py-2 shrink-0 text-stone-400" aria-label="Read value aloud">
          <Icon name="volume_up" size={16}  />
        </button>
      </div>
      {micError && <p className="text-xs text-red-600 mt-0.5">Voice input isn't supported on this browser — please type instead.</p>}
    </div>
  );
}
function TextInput({ value, onChange, placeholder }) {
  const [listening, setListening] = useState(false);

  const recRef = useRef(null);

  function toggleMic() {
    if (listening) {

      setListening(false);
      return;
    }

    const rec = startVoiceInput(
      (transcript) => {
        onChange(transcript);
        speakText(transcript);
        setListening(false);
      },
      () => setListening(false)
    );
    if (rec) {
      recRef.current = rec;
      setListening(true);
    } else {
      setMicError(true);
    }
  }

  return (
    <div>
      <div className="mt-1 flex items-center border border-stone-400 rounded-md bg-white focus-within:ring-2 focus-within:ring-amber-600">
        <input
          type="text"
          value={value}
          placeholder={placeholder}
          onChange={(e) => onChange(e.target.value)}
          className="w-full px-3 py-2 outline-none text-sm bg-transparent min-w-0"
        />
        <button type="button" onClick={toggleMic} className={`px-2 py-2 shrink-0 ${listening ? "text-red-600 animate-pulse" : "text-stone-400"}`} aria-label="Speak to enter value">
          {listening ? <Icon name="mic_off" size={16}  /> : <Icon name="mic" size={16}  />}
        </button>
        <button type="button" onClick={() => speakText(value || "empty")} className="pr-3 pl-1 py-2 shrink-0 text-stone-400" aria-label="Read value aloud">
          <Icon name="volume_up" size={16}  />
        </button>
      </div>
      {micError && <p className="text-xs text-red-600 mt-0.5">Voice input isn't supported on this browser — please type instead.</p>}
    </div>
  );
}

function renderField(f, obj, setObj) {
  const set = (v) => setObj({ ...obj, [f.k]: v });
  return (
    <Field key={f.k} label={f.l} help={f.help} mandatory={f.mandatory}>
      {f.type === "number" ? <NumInput prefix={f.prefix || "₹"} value={obj[f.k]} onChange={set} />
        : f.type === "date" ? <DateInput value={obj[f.k]} onChange={set} />
        : f.type === "select" ? <SelectInput value={obj[f.k]} onChange={set} opts={f.opts} />
        : <TextInput value={obj[f.k]} onChange={set} placeholder={f.placeholder} />}
    </Field>
  );
}
function FieldGrid({ fields, obj, setObj }) {

// Classic two-column "T" ledger account (Dr. left / Cr. right) — used for the Trading Account and the Profit &
// Loss Account, exactly as small businesses/CAs prepare them by hand.
function LedgerAccount({ title, dr, cr }) {
  const drTotal = dr.reduce((s, r) => s + (r.amount || 0), 0);
  const crTotal = cr.reduce((s, r) => s + (r.amount || 0), 0);
  const grand = Math.max(drTotal, crTotal);
  const Side = ({ side, rows }) => (
    <div className={side === "dr" ? "border-r border-stone-300" : ""}>
      <div className="flex justify-between px-2 py-1 bg-stone-200 font-semibold border-b border-stone-300">
        <span>{side === "dr" ? "Dr." : "Cr."}</span><span>Amount (₹)</span>
      </div>
      {rows.map((r, i) => (
        <div key={i} className={`flex justify-between gap-2 px-2 py-1 ${r.bold ? "font-semibold border-t border-stone-300" : "border-b border-stone-100"}`}>
          <span className={r.auto ? "text-red-700" : ""}>{side === "dr" ? "To " : "By "}{r.label}</span>
          <span className="mono shrink-0">{inr(r.amount)}</span>
        </div>
      ))}
      <div className="flex justify-between px-2 py-1 bg-stone-100 font-bold border-t-2 border-stone-400">
        <span>Total</span><span className="mono">{inr(grand)}</span>
      </div>
    </div>
  );
  return (
    <div className="border border-stone-300 rounded-md overflow-hidden mb-3">
      <div className="bg-emerald-900 text-stone-50 text-center text-xs font-bold py-1.5 serif">{title}</div>
      <div className="grid grid-cols-2 text-xs">
        <Side side="dr" rows={dr} />
        <Side side="cr" rows={cr} />
      </div>
    </div>
  );
}

// Classic two-column Balance Sheet — Liabilities (left) / Assets (right), each broken into categorised,
// itemised sections with sub-totals, exactly as small businesses prepare it.
function BalanceSheetBreakupTable({ title, liabSections, assetSections, note }) {
  const liabTotal = liabSections.reduce((s, sec) => s + sec.total, 0);
  const assetTotal = assetSections.reduce((s, sec) => s + sec.total, 0);
  // NOTE: liabTotal and assetTotal are shown as-is (NOT forced equal) so a genuine mismatch (e.g. the Year 2
  // projection, where Owner's Capital is rolled forward rather than plugged) is visible here too, consistent
  // with the separate "Balance Sheet Mismatch" warning shown below this table when they differ.
  const Side = ({ side, sections, total }) => (
    <div className={side === "liab" ? "border-r border-stone-300" : ""}>
      <div className="px-2 py-1 bg-stone-200 font-semibold border-b border-stone-300">{side === "liab" ? "Liabilities" : "Assets"}</div>
      {sections.map((sec, i) => (
        <div key={i} className="border-b border-stone-200">
          <div className="px-2 pt-1 text-stone-500 font-semibold uppercase text-[10px]">{sec.heading}</div>
          {sec.items.map((it, j) => (
            <div key={j} className="flex justify-between gap-2 px-2 py-0.5">
              <span className={it.auto ? "text-red-700" : ""}>{it.label}</span>
              <span className="mono shrink-0">{inr(it.amount)}</span>
            </div>
          ))}
          <div className="flex justify-between px-2 py-0.5 font-semibold border-t border-stone-100">
            <span>Total {sec.heading}</span><span className="mono">{inr(sec.total)}</span>
          </div>
        </div>
      ))}
      <div className={`flex justify-between px-2 py-1 bg-stone-100 font-bold border-t-2 border-stone-400`}>
        <span>TOTAL {side === "liab" ? "LIABILITIES" : "ASSETS"}</span><span className="mono">{inr(total)}</span>
      </div>
    </div>
  );
  return (
    <div className="border border-stone-300 rounded-md overflow-hidden mb-3">
      <div className="bg-emerald-900 text-stone-50 text-center text-xs font-bold py-1.5 serif">{title}</div>
      <div className="grid grid-cols-2 text-xs">
        <Side side="liab" sections={liabSections} total={liabTotal} />
        <Side side="asset" sections={assetSections} total={assetTotal} />
      </div>
      {note && <p className="text-[11px] text-stone-500 px-2 py-1 border-t border-stone-200">{note}</p>}
    </div>
  );
}

// ---------------- Classic ledger-format builders (single source — feeds on-screen panels, Report, both PDFs) ----------------
// Traditional Trading & Profit and Loss Account exactly as small Indian businesses/CAs prepare it in two separate
// "T" accounts: Dr. (left, "To ...") and Cr. (right, "By ..."). Gross Profit is carried down ("c/d") on the Dr
// side of the Trading Account (the balancing figure) and brought down ("b/d") on the Cr side of the P&L Account —
// this is why it appears on the right in the P&L Account, as requested. No new calculations — reuses the existing
// calc figures (COGS/GP/NP) exactly as already computed; this only changes how they are laid out.
function buildTradingPLLedger(calc, openingStock, govtSubsidy, h2) {
  const trading = {
    dr: [
      { label: "Opening Stock", amount: num(openingStock) },
      { label: "Purchases", amount: calc.totalPurchases, auto: true },
      { label: "Gross Profit c/d", amount: calc.grossProfit, bold: true, auto: true },
    ],
    cr: [
      { label: "Sales", amount: calc.totalSales, auto: true },
      { label: "Closing Stock", amount: calc.closingStock, auto: true },
    ],
  };
  const dr = [];
  // Headwise Operating & Administrative Expenses (single source — these line items sum to exactly calc.opexOnly,
  // the same figure used everywhere else, so nothing is duplicated or out of sync).
  const expenseHeads = (h2 ? H2_EXPENDITURE_FIELDS.map((f) => ({ label: shortLabel(f.l), amount: num(h2[f.k]) })) : []).filter((x) => x.amount > 0);
  if (expenseHeads.length) {
    dr.push(...expenseHeads);
  } else if (calc.opexOnly > 0) {
    dr.push({ label: "Operating & Administrative Expenses", amount: calc.opexOnly, auto: true });
  }
  if (num(calc.interestShgFinal) > 0) dr.push({ label: "Interest on SHG Loan", amount: calc.interestShgFinal, auto: true });
  if (num(calc.interestBankFinal) > 0) dr.push({ label: "Interest on Bank Loan", amount: calc.interestBankFinal, auto: true });
  if (num(calc.interestInformalFinal) > 0) dr.push({ label: "Interest on Informal Loan", amount: calc.interestInformalFinal, auto: true });
  if (num(calc.interestOtherBankFinal) > 0) dr.push({ label: "Interest on Other Bank Loan/OD", amount: calc.interestOtherBankFinal, auto: true });
  dr.push({ label: "Net Profit c/d", amount: calc.netProfit, bold: true, auto: true });
  const cr = [{ label: "Gross Profit b/d", amount: calc.grossProfit, bold: true, auto: true }];
  if (calc.totalOtherIncome > 0) cr.push({ label: "Other Income", amount: calc.totalOtherIncome, auto: true });
  if (num(govtSubsidy) > 0) cr.push({ label: "Government Subsidy/Grant", amount: num(govtSubsidy) });
  return { trading, pl: { dr, cr } };
}

// Classic small-business Balance Sheet: Liabilities (left) / Assets (right), each broken into categorised,
// itemised sections with sub-totals — exactly the format most small traders' account books use, rather than a
// single lump total per category. Items with a zero amount are omitted for brevity. No new calculations — reuses
// the existing totalCL/totalLTL/totalFA/totalOA/totalCA/ownersCapital figures exactly as already computed.
function shortLabel(l) { return l.split(" / ")[0]; }
function buildBalanceSheetBreakup(calc, credit, h3) {
  const liabSections = [
    { heading: "Owner's Capital / Net Worth", items: [], total: calc.ownersCapital },
    {
      heading: "Long-Term Liabilities",
      items: [
        { label: "Bank Term Loan Outstanding", amount: num(credit.bankLoanOutstanding) },
        ...LTL_FIELDS.map((f) => ({ label: shortLabel(f.l), amount: num(h3[f.k]) })),
      ].filter((x) => x.amount > 0),
      total: calc.totalLTL,
    },
    {
      heading: "Current Liabilities",
      items: [
        { label: "SHG Loan Outstanding", amount: num(credit.shgLoanOutstanding) },
        { label: "Informal Loan (Family/Friends)", amount: num(credit.informalLoan) },
        { label: "Trade Creditors (auto)", amount: calc.creditorsAuto, auto: true },
        ...CL_FIELDS.map((f) => ({ label: shortLabel(f.l), amount: num(h3[f.k]) })),
      ].filter((x) => x.amount > 0),
      total: calc.totalCL,
    },
  ];
  const assetSections = [
    {
      heading: "Fixed Assets",
      items: FA_FIELDS.map((f) => ({ label: shortLabel(f.l), amount: num(h3[f.k]) })).filter((x) => x.amount > 0),
      total: calc.totalFA,
    },
    {
      heading: "Other Assets",
      items: OA_FIELDS.map((f) => ({ label: shortLabel(f.l), amount: num(h3[f.k]) })).filter((x) => x.amount > 0),
      total: calc.totalOA,
    },
    {
      heading: "Current Assets",
      items: [
        { label: "Cash in Hand", amount: num(h3.cashInHand) },
        { label: "Cumulative SHG Savings", amount: num(credit.cumulativeShgSavings) },
        { label: "Own Savings Bank Balance", amount: num(credit.ownSbSavings) },
        { label: "Fixed / Recurring Deposits", amount: num(credit.fdRd) },
        { label: "Other Savings", amount: num(credit.otherSavings) },
        { label: "Closing Stock (auto)", amount: calc.closingStock, auto: true },
        { label: "Debtors / Receivables (auto)", amount: calc.debtorsAuto, auto: true },
        { label: "Advance Paid to Suppliers", amount: num(h3.advancePaidSuppliers) },
        { label: "Other Current Assets", amount: num(h3.otherCA) },
      ].filter((x) => x.amount > 0),
      total: calc.totalCA,
    },
  ];
  return { liabSections, assetSections };
}
// Year 2 projection only has category-level totals (ownersCapitalY2/ltlY2/clY2/faY2/oaY2/caY2), not itemised
// sub-figures, so it uses the same two-column Liabilities/Assets layout with totals only per category.
function buildBalanceSheetBreakupY2(calc) {
  return {
    liabSections: [
      { heading: "Owner's Capital / Net Worth (rolled forward)", items: [], total: calc.ownersCapitalY2 },
      { heading: "Long-Term Liabilities", items: [], total: calc.ltlY2 },

      { heading: "Current Assets", items: [], total: calc.caY2 },

// How the Working Capital Cycle (Raw Material + Stock/Finished Goods + Debtors − Suppliers' Credit) splits by
// business type. Trading buys and resells without converting anything, so it has no Raw Material stage — just
// Stock (goods for resale). Manufacturing holds both Raw Material (before conversion) and Finished Goods (after)
// separately. Services holds little/no finished-goods stock but typically holds some Raw Material/consumables for
// the service delivered, and waits mainly on debtor payments. All fractions are of the total cycle entered;
// Debtors is always the residual so the net formula lands exactly on that total (e.g. 90 days).
const HOLDING_COMPOSITION = {
  Trading: { rmFrac: 0, stockFrac: 0.55, suppliersFrac: 0.08 },
  Manufacturing: { rmFrac: 0.25, stockFrac: 0.45, suppliersFrac: 0.06 },
  Services: { rmFrac: 0.15, stockFrac: 0, suppliersFrac: 0.05 },
};
function holdingComposition(enterpriseType, totalDays) {
  const comp = HOLDING_COMPOSITION[enterpriseType] || HOLDING_COMPOSITION.Trading;
  const rawMaterialDays = Math.round(totalDays * comp.rmFrac);
  const stockHoldingDays = Math.round(totalDays * comp.stockFrac);
  const suppliersDays = Math.round(totalDays * comp.suppliersFrac);
  const debtorsDays = totalDays - rawMaterialDays - stockHoldingDays + suppliersDays;
  return { rawMaterialDays, stockHoldingDays, suppliersDays, debtorsDays };
}

function findLocalAnswer(question, issues) {
  const q = question.toLowerCase();

  // Questions about data problems/discrepancies pull live from the Checks engine.
  if (/(difference|discrepanc|mismatch|wrong|error|issue|problem|check my data|any issues|data correct|consistent)/.test(q)) {
    if (!issues || issues.length === 0) {
      return "I checked your data — no issues found right now. Figures are consistent and mandatory fields look complete. (You can always open the clipboard ✓ icon in the header for the full Checks list.)";
    }
    const top = issues.slice(0, 5);
    const lines = top.map((iss, i) => `${i + 1}. ${iss.title} — ${iss.fix}`);
    const more = issues.length > 5 ? `\n…and ${issues.length - 5} more. See the clipboard ✓ icon in the header for the full list.` : "";
    return `I found ${issues.length} thing${issues.length > 1 ? "s" : ""} worth checking:\n\n${lines.join("\n")}${more}`;
  }

  for (const entry of CHAT_KB) {
    if (entry.k.some((kw) => q.includes(kw))) return entry.a;
  }

  return "I don't have a ready answer for that in offline mode — try asking about margin money, DSCR/FOIR, the balance sheet, working capital methods, sharing/printing, or tap 'Are there any issues with my data?' to check your figures. You can also browse the clipboard ✓ (Checks) or the field help icons (?) around the form.";
}

function ChatWidget({ open, onClose, contextSummary, step, issues }) {
  const [messages, setMessages] = useState([
    { role: "assistant", text: "Namaste! I can help you understand this form and check your data — fully offline, no internet needed. Ask me anything, by typing or tapping the mic to speak." },
  ]);
  const [input, setInput] = useState("");
  const [listening, setListening] = useState(false);
  const [error, setError] = useState("");
  const recognitionRef = useRef(null);

  function toggleMic() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      setError("Voice input isn't supported on this browser — please type your question instead.");
      return;
    }
    if (listening) {
      recognitionRef.current && recognitionRef.current.stop();
      setListening(false);
      return;
    }
    const rec = new SR();
    rec.lang = "en-IN";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    rec.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      setInput((prev) => (prev ? prev + " " : "") + transcript);
    };
    rec.onerror = () => setListening(false);
    rec.onend = () => setListening(false);
    recognitionRef.current = rec;
    setError("");
    setListening(true);
    rec.start();
  }

  function send(text) {
    const q = (text || input).trim();
    if (!q) return;
    const answer = findLocalAnswer(q, issues);
    setMessages((cur) => [...cur, { role: "user", text: q }, { role: "assistant", text: answer }]);
    setInput("");
  }

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-40 no-print flex items-end justify-center sm:items-center">
      <div className="absolute inset-0 bg-black bg-opacity-30" onClick={onClose} />
      <div className="relative w-full sm:max-w-md bg-stone-100 rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden" style={{ height: "80vh" }}>
        <div className="bg-emerald-900 text-stone-50 px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Icon name="chat" size={18} className="text-amber-400"  />
            <span className="serif font-bold text-sm">Ask the Credit Advisor</span>
          </div>
          <button onClick={onClose}><Icon name="close" size={18}  /></button>
        </div>
        <div className="flex-1 overflow-y-auto px-3 py-3 space-y-2">
          {messages.map((m, i) => (
            <div key={i} className={`max-w-xs rounded-lg px-3 py-2 text-sm whitespace-pre-wrap ${m.role === "user" ? "bg-emerald-900 text-stone-50 ml-auto" : "bg-white border border-stone-300 text-emerald-900"}`}>
              {m.text}
            </div>
          ))}
          {error && <Banner tone="danger">{error}</Banner>}
        </div>
        <div className="px-3 pb-2 flex gap-2 flex-wrap">
          {(SUGGESTED_QUESTIONS[step] || []).map((q) => (
            <button key={q} onClick={() => send(q)} className="text-xs px-2 py-1 rounded-full border border-stone-400 text-stone-600 bg-white hover:bg-stone-200">
              {q}
            </button>
          ))}
        </div>
        <div className="border-t border-stone-300 p-2 flex gap-2 bg-white">
          <button
            onClick={toggleMic}
            className={`px-3 py-2 rounded-md ${listening ? "bg-red-600 text-white animate-pulse" : "bg-stone-200 text-emerald-900"}`}
            aria-label={listening ? "Stop listening" : "Speak your question"}
          >
            {listening ? <Icon name="mic_off" size={16}  /> : <Icon name="mic" size={16}  />}
          </button>
          <input
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && send()}
            placeholder={listening ? "Listening…" : "Ask a question or tap the mic…"}
            className="flex-1 px-3 py-2 rounded-md border border-stone-400 outline-none text-sm"
          />
          <button onClick={() => send()} className="px-3 py-2 rounded-md bg-amber-600 text-white">
            <Icon name="send" size={16}  />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ===== Practice Case import engine (shared logic with IELA Practice Lab; validates before anything is applied) ===== */
const PracticeImport = (function () {
const SCHEMA_VERSION = "1.0";
const DEMO_LABEL = "DEMO / PRACTICE DATA";
function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }


function blankPayload() {
  const blank = (arr) => Object.fromEntries(arr.map((f) => [f.k, ""]));

    identity: blank([...SHG_FIELDS, ...MEMBER_FIELDS]),
    documents: Object.fromEntries(DOCUMENTS.map((d) => [d.k, { status: "Pending", remarks: "" }])),
    enterprise: blank(ENTERPRISE_FIELDS),
    credit: blank(CREDIT_HISTORY_FIELDS),
    loanF: Object.fromEntries(F1_FIELDS.map((f) => [f.k, f.k === "tenureMonths" ? 36 : f.k === "interestRate" ? 12 : ""])),
    wc: { ...blank(F2_FIELDS), wcCycleDays: 90, totalWcRequired: "", wcLoanAmount: "", marginPercent: 10 },
    tl: { ...blank(F3_FIELDS), quotedPrice: "", tlAmount: "", marginPercent: 10 },
    h1: {
      high: { months: 3, dailySale: "", avgMonthlySaleManual: "", margin: "", otherInc: "" },
      low: { months: 3, dailySale: "", avgMonthlySaleManual: "", margin: "", otherInc: "" },
      avg: { months: 6, dailySale: "", avgMonthlySaleManual: "", margin: "", otherInc: "" },
    },
    h2: { ...blank(H2_EXPENDITURE_FIELDS), interestShgOverride: "", interestBankOverride: "", interestInformalOverride: "", interestOtherBankOverride: "" },
    govtSubsidy: "",
    openingStock: "",
    h3: { ...blank([...CL_FIELDS, ...LTL_FIELDS, ...CA_FIELDS, ...FA_FIELDS, ...OA_FIELDS]), clBankLoanSTRate: "" },
    drawings: "",
    proj: { growthSalesY2: 20, growthSalesY3: 15, growthOpexY2: 15, growthOpexY3: 12, growthEmployeesY2: 50, growthEmployeesY3: 0 },
    k1: blank(K1_FIELDS),
    hhInc: blank(K2_INCOME_FIELDS),
    hhExp: blank(K2_EXPENDITURE_FIELDS),
    emiL1: { monthlyHHIncomeOverride: "", monthlyHHExpenditureOverride: "", existingEmiBankOverride: "" },
    projectedTurnoverOverride: "",
  };
}

/* Deep-merge partial over blank (only for known container keys; scalars replaced) */
function overlay(base, part) {
  if (!isObj(part)) return base;
  for (const k of Object.keys(part)) {
    if (k === "__proto__" || k === "constructor" || k === "prototype") continue;
    if (isObj(part[k]) && isObj(base[k])) overlay(base[k], part[k]);
    else base[k] = part[k];
  }
  return base;
}

const MAPPING = [
  { section: "identity", targets: ["identity"], note: "SHG_FIELDS + MEMBER_FIELDS (Step 1 A/B)" },
  { section: "documents", targets: ["documents"], note: "DOCUMENTS checklist: {status, remarks} (Step 1 C)" },
  { section: "enterprise", targets: ["enterprise"], note: "ENTERPRISE_FIELDS (Step 2)" },
  { section: "creditHistory", targets: ["credit"], note: "CREDIT_HISTORY_FIELDS (Step 2, Section E)" },
  { section: "loanDetails", targets: ["loanF", "wc", "tl", "emiL1"], note: "F1 facility, F2 working capital, F3 term loan, EMI feasibility overrides" },
  { section: "financials", targets: ["h1", "h2", "govtSubsidy", "openingStock", "h3", "drawings"], note: "Step 3: sales, expenses, balance-sheet items" },
  { section: "projections", targets: ["proj", "projectedTurnoverOverride"], note: "Step 4: growth assumptions" },
  { section: "household", targets: ["k1", "hhInc", "hhExp"], note: "Step 5: household profile, income, expenditure (annual ₹)" },
];
const DERIVED_KEYS = { tl: ["tlAmount"], wc: ["totalWcRequired"], loanF: ["proposedEmi"] }; // IELA recalculates these itself

/* schema of every importable key: {type, opts} built from IELA's own field arrays */
function buildSchema() {
  const t = (arr, extra) => { const o = {}; arr.forEach((f) => { o[f.k] = { type: f.type === "select" ? "select" : f.type === "date" ? "date" : f.type === "number" || !f.type ? "number" : "text", opts: f.opts }; }); return Object.assign(o, extra || {}); };
  const N = { type: "number" };
  const S = {
    identity: t([...SHG_FIELDS, ...MEMBER_FIELDS]),
    enterprise: t(ENTERPRISE_FIELDS),
    credit: t(CREDIT_HISTORY_FIELDS),
    loanF: t(F1_FIELDS, { proposedEmi: N }),
    wc: t(F2_FIELDS, { wcCycleDays: N, totalWcRequired: N, wcLoanAmount: N, marginPercent: N }),
    tl: t(F3_FIELDS, { quotedPrice: N, tlAmount: N, marginPercent: N }),
    h2: t(H2_EXPENDITURE_FIELDS, { interestShgOverride: N, interestBankOverride: N, interestInformalOverride: N, interestOtherBankOverride: N }),
    h3: t([...CL_FIELDS, ...LTL_FIELDS, ...CA_FIELDS, ...FA_FIELDS, ...OA_FIELDS], { clBankLoanSTRate: N }),
    proj: { growthSalesY2: N, growthSalesY3: N, growthOpexY2: N, growthOpexY3: N, growthEmployeesY2: N, growthEmployeesY3: N },
    k1: t(K1_FIELDS),
    hhInc: t(K2_INCOME_FIELDS),
    hhExp: t(K2_EXPENDITURE_FIELDS),
    emiL1: { monthlyHHIncomeOverride: N, monthlyHHExpenditureOverride: N, existingEmiBankOverride: N },
  };
  // CIBIL is free text in IELA (e.g. "NTC" or a number) — accept either
  S.credit.cibilScore = { type: "text" };
  S.identity.dateOfVisit = { type: "date" };
  return S;
}
const SCHEMA = buildSchema();
const SCALARS = { govtSubsidy: "number", openingStock: "number", drawings: "number", projectedTurnoverOverride: "number" };
const DOC_STATUS = ["Pending", "Collected", "Not Applicable"];
const FIELD_STATUS_VALUES = ["provided", "unknown", "notApplicable", "notVerified", "iela-default"];
const BAD_KEYS = ["__proto__", "constructor", "prototype"];


/* Validate an envelope (JSON.parse'd). Never throws. Returns a report and, if usable, the mapped IELA payload. */
function validateEnvelope(env) {
  const R = { ok: false, errors: [], warnings: [], unsupported: [], derivedNotes: [], mapped: null, fieldStatus: {}, counts: { applied: 0, blank: 0 }, rows: [], meta: {} };
  const err = (m) => R.errors.push(m), warn = (m) => R.warnings.push(m);
  try {
    if (!isObj(env)) { err("The file is not a JSON object."); return R; }
    if (typeof env.schemaVersion !== "string") err("schemaVersion is missing.");
    else if (env.schemaVersion.split(".")[0] !== SCHEMA_VERSION.split(".")[0]) err("Unsupported schemaVersion '" + env.schemaVersion + "'. This importer understands " + SCHEMA_VERSION.split(".")[0] + ".x.");
    else if (env.schemaVersion !== SCHEMA_VERSION) warn("Minor schema difference: file is " + env.schemaVersion + ", importer expects " + SCHEMA_VERSION + ".");
    if (env.source !== "IELA Practice Lab") err("This is not an IELA Practice Lab file (source = " + JSON.stringify(String(env.source)).slice(0, 40) + ").");
    if (env.mode !== "training") err("mode must be 'training'. Answer-key or other file types cannot be imported as an application.");
    if (typeof env.label !== "string" || env.label.toUpperCase().indexOf("DEMO") < 0) err("File is not labelled DEMO / PRACTICE DATA, so it is refused to keep real and practice records separate.");
    if (R.errors.length) return R;
    R.meta = { caseId: String(env.caseId || "").slice(0, 60), caseTitle: String(env.caseTitle || "").slice(0, 120), businessType: String(env.businessType || "").slice(0, 30), exportedAt: String(env.exportedAt || "").slice(0, 40), level: env.trainingMeta && env.trainingMeta.level ? String(env.trainingMeta.level).slice(0, 20) : "" };
    const known = ["schemaVersion", "source", "sourceVersion", "targetApp", "targetAppVersionTested", "mode", "label", "caseId", "caseTitle", "businessType", "exportedAt", "fieldStatus", "trainingMeta"].concat(MAPPING.map((m) => m.section));
    Object.keys(env).forEach((k) => { if (known.indexOf(k) < 0) R.unsupported.push("(top level) " + k); });

    const out = blankPayload();
    const checkVal = (path, sch, v) => {
      // returns [ok, cleaned]
      if (v === undefined) return [false];
      if (v === "" || v === null) return [true, ""];
      if (sch.type === "number") {
        if (typeof v === "number" && isFinite(v)) { if (v < 0) warn(path + " is negative (" + v + ")."); return [true, v]; }
        if (typeof v === "string" && v.trim() !== "" && isFinite(Number(v))) { return [true, Number(v)]; }
        err(path + " must be a number or blank (got " + JSON.stringify(String(v)).slice(0, 30) + ")."); return [false];
      }
      if (sch.type === "date") {
        if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v) && !isNaN(Date.parse(v))) return [true, v];
        err(path + " must be a date as YYYY-MM-DD (got " + JSON.stringify(String(v)).slice(0, 30) + ")."); return [false];
      }
      if (sch.type === "select") {
        if (typeof v === "string" && sch.opts.indexOf(v) >= 0) return [true, v];
        err(path + " must be one of: " + sch.opts.join(" | ") + " (got " + JSON.stringify(String(v)).slice(0, 30) + ")."); return [false];
      }
      if (typeof v === "string" || typeof v === "number") { const s = String(v); if (s.length > 400) { err(path + " is too long."); return [false]; } return [true, s]; }
      err(path + " must be text."); return [false];
    };
    const applySection = (iela, srcObj, label) => {
      if (srcObj === undefined) return;
      if (!isObj(srcObj)) { err(label + " must be an object."); return; }
      const sch = SCHEMA[iela];
      Object.keys(srcObj).forEach((k) => {
        const path = iela + "." + k;
        if (BAD_KEYS.indexOf(k) >= 0) { R.unsupported.push(path + " (blocked key)"); return; }
        if (!sch[k]) { R.unsupported.push(path); return; }
        const r = checkVal(path, sch[k], srcObj[k]);
        if (!r[0]) return;
        out[iela][k] = r[1];
        if (r[1] === "") R.counts.blank++; else R.counts.applied++;
        R.rows.push({ path, value: r[1], section: label });
        if ((DERIVED_KEYS[iela] || []).indexOf(k) >= 0 && r[1] !== "") R.derivedNotes.push(path + " = " + r[1] + " is a derived figure; IELA will recalculate it from its source fields.");
      });
    };
    // identity / enterprise / credit
    applySection("identity", env.identity, "identity");
    applySection("enterprise", env.enterprise, "enterprise");
    applySection("credit", env.creditHistory, "creditHistory");
    // documents
    if (env.documents !== undefined) {
      if (!isObj(env.documents)) err("documents must be an object.");
      else Object.keys(env.documents).forEach((k) => {
        const d = DOCUMENTS.find((x) => x.k === k);
        if (BAD_KEYS.indexOf(k) >= 0 || !d) { R.unsupported.push("documents." + k); return; }
        const v = env.documents[k];
        if (!isObj(v)) { err("documents." + k + " must be {status, remarks}."); return; }
        if (DOC_STATUS.indexOf(v.status) < 0) { err("documents." + k + ".status must be Pending, Collected or Not Applicable."); return; }
        out.documents[k] = { status: v.status, remarks: typeof v.remarks === "string" ? v.remarks.slice(0, 300) : "" };
        R.counts.applied++; R.rows.push({ path: "documents." + k, value: v.status, section: "documents" });
        Object.keys(v).forEach((kk) => { if (kk !== "status" && kk !== "remarks") R.unsupported.push("documents." + k + "." + kk); });
      });
    }
    // loanDetails
    if (env.loanDetails !== undefined) {
      if (!isObj(env.loanDetails)) err("loanDetails must be an object.");
      else {
        Object.keys(env.loanDetails).forEach((k) => { if (["loanF", "wc", "tl", "emiL1"].indexOf(k) < 0) R.unsupported.push("loanDetails." + k); });
        ["loanF", "wc", "tl", "emiL1"].forEach((k) => applySection(k, env.loanDetails[k], "loanDetails"));
      }
    }
    // financials
    if (env.financials !== undefined) {
      const f = env.financials;
      if (!isObj(f)) err("financials must be an object.");
      else {
        Object.keys(f).forEach((k) => { if (["h1", "h2", "h3", "govtSubsidy", "openingStock", "drawings"].indexOf(k) < 0) R.unsupported.push("financials." + k); });
        applySection("h2", f.h2, "financials"); applySection("h3", f.h3, "financials");
        ["govtSubsidy", "openingStock", "drawings"].forEach((k) => { if (f[k] !== undefined) { const r = checkVal("financials." + k, { type: "number" }, f[k]); if (r[0]) { out[k] = r[1]; r[1] === "" ? R.counts.blank++ : R.counts.applied++; R.rows.push({ path: k, value: r[1], section: "financials" }); } } });
        if (f.h1 !== undefined) {
          if (!isObj(f.h1)) err("financials.h1 must be an object.");
          else Object.keys(f.h1).forEach((row) => {
            if (["high", "low", "avg"].indexOf(row) < 0) { R.unsupported.push("financials.h1." + row); return; }
            const src = f.h1[row]; if (!isObj(src)) { err("financials.h1." + row + " must be an object."); return; }
            Object.keys(src).forEach((k) => {
              const path = "h1." + row + "." + k;
              if (["months", "dailySale", "avgMonthlySaleManual", "margin", "otherInc"].indexOf(k) < 0) { R.unsupported.push(path); return; }
              const r = checkVal(path, { type: "number" }, src[k]);
              if (r[0]) { out.h1[row][k] = r[1]; r[1] === "" ? R.counts.blank++ : R.counts.applied++; R.rows.push({ path, value: r[1], section: "financials" }); }
            });

          });

    }

    if (env.projections !== undefined) {
      if (!isObj(env.projections)) err("projections must be an object.");
      else {
        Object.keys(env.projections).forEach((k) => { if (["proj", "projectedTurnoverOverride"].indexOf(k) < 0) R.unsupported.push("projections." + k); });
        applySection("proj", env.projections.proj, "projections");
        if (env.projections.projectedTurnoverOverride !== undefined) { const r = checkVal("projectedTurnoverOverride", { type: "number" }, env.projections.projectedTurnoverOverride); if (r[0]) { out.projectedTurnoverOverride = r[1]; R.rows.push({ path: "projectedTurnoverOverride", value: r[1], section: "projections" }); r[1] === "" ? R.counts.blank++ : R.counts.applied++; } }
      }
    }
    // household
    if (env.household !== undefined) {

              <table className="w-full text-xs mb-2"><tbody>
                {Object.keys(g).map((k) => <tr key={k} className="border-b border-stone-200"><td className="py-1">{k}</td><td className="py-1 text-right mono">{g[k]}</td></tr>)}

              <button onClick={() => setShowRows(!showRows)} className="text-xs underline text-emerald-900 mb-2">{showRows ? "Hide" : "Show"} every mapped field</button>
              {showRows && (
                <div className="max-h-48 overflow-y-auto border border-stone-200 rounded mb-2">
                  <table className="w-full text-xs"><tbody>
                    {rep.rows.map((r, i) => <tr key={i} className="border-b border-stone-100"><td className="py-0.5 px-1 mono break-all">{r.path}</td><td className="py-0.5 px-1 break-all">{String(r.value) === "" ? <em className="text-stone-400">(blank)</em> : String(r.value)}</td></tr>)}

              {flags && (flags.notVerified.length + flags.unknown.length + flags.notApplicable.length + flags.ielaDefault.length > 0) && (

                <label className="flex items-start gap-2 text-xs mt-3 cursor-pointer">

  );
}

function App() {
  const [step, setStep] = useState(0);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
  }, [step]);
  const [chatOpen, setChatOpen] = useState(false);
  const [diagOpen, setDiagOpen] = useState(false);
  const [bpmOpen, setBpmOpen] = useState(false);
  const [fsOpen, setFsOpen] = useState(false);
  const [clafOpen, setClafOpen] = useState(false);
  const [submissions, setSubmissions] = useState([]);
  const [submissionsLoading, setSubmissionsLoading] = useState(false);
  const [submissionsError, setSubmissionsError] = useState("");
  const [submitStatus, setSubmitStatus] = useState("");

  const [identity, setIdentity] = useState(Object.fromEntries([...SHG_FIELDS, ...MEMBER_FIELDS].map((f) => [f.k, ""])));
  const [documents, setDocuments] = useState(Object.fromEntries(DOCUMENTS.map((d) => [d.k, { status: "Pending", remarks: "" }])));

  const [enterprise, setEnterprise] = useState(Object.fromEntries(ENTERPRISE_FIELDS.map((f) => [f.k, ""])));
  const [credit, setCredit] = useState(Object.fromEntries(CREDIT_HISTORY_FIELDS.map((f) => [f.k, ""])));
  const [loanF, setLoanF] = useState({
    ...Object.fromEntries(F1_FIELDS.map((f) => [f.k, f.k === "tenureMonths" ? 36 : f.k === "interestRate" ? 12 : ""])),
  });
  const [wc, setWc] = useState({
    ...Object.fromEntries(F2_FIELDS.map((f) => [f.k, ""])),
    wcCycleDays: 90, totalWcRequired: "", wcLoanAmount: "", marginPercent: 10,
  });
  const [tl, setTl] = useState({ ...Object.fromEntries(F3_FIELDS.map((f) => [f.k, ""])), quotedPrice: "", tlAmount: "", marginPercent: 10 });

  const [h1, setH1] = useState({
    high: { months: 3, dailySale: "", avgMonthlySaleManual: "", margin: "", otherInc: "" },
    low: { months: 3, dailySale: "", avgMonthlySaleManual: "", margin: "", otherInc: "" },
    avg: { months: 6, dailySale: "", avgMonthlySaleManual: "", margin: "", otherInc: "" },
  });
  const [h2, setH2] = useState({ ...Object.fromEntries(H2_EXPENDITURE_FIELDS.map((f) => [f.k, ""])), interestShgOverride: "", interestBankOverride: "", interestInformalOverride: "", interestOtherBankOverride: "" });
  const [govtSubsidy, setGovtSubsidy] = useState("");
  const [openingStock, setOpeningStock] = useState("");
  const [h3, setH3] = useState({
    ...Object.fromEntries([...CL_FIELDS, ...LTL_FIELDS, ...CA_FIELDS, ...FA_FIELDS, ...OA_FIELDS].map((f) => [f.k, ""])),
    clBankLoanSTRate: "",
  });
  const [drawings, setDrawings] = useState("");

  const [proj, setProj] = useState({ growthSalesY2: 20, growthSalesY3: 15, growthOpexY2: 15, growthOpexY3: 12, growthEmployeesY2: 50, growthEmployeesY3: 0 });

  const [k1, setK1] = useState(Object.fromEntries(K1_FIELDS.map((f) => [f.k, ""])));
  const [hhInc, setHhInc] = useState(Object.fromEntries(K2_INCOME_FIELDS.map((f) => [f.k, ""])));
  const [hhExp, setHhExp] = useState(Object.fromEntries(K2_EXPENDITURE_FIELDS.map((f) => [f.k, ""])));

  const [emiL1, setEmiL1] = useState({ monthlyHHIncomeOverride: "", monthlyHHExpenditureOverride: "", existingEmiBankOverride: "" });
  const [projectedTurnoverOverride, setProjectedTurnoverOverride] = useState("");

  // ---------------- autofill: pre-populate fields once the source data is available, without overwriting user edits ----------------
  useEffect(() => {
    if (!enterprise.districtState && (identity.district || identity.state)) {
      setEnterprise((e) => (e.districtState ? e : { ...e, districtState: [identity.district, identity.state].filter(Boolean).join(", ") }));
    }
  }, [identity.district, identity.state]);

  // Term Loan: Quoted Price is the source. Term Loan Amount = Price × (1 − Margin%), recalculated live whenever
  // Price or Margin % changes — so if a bank later raises the margin requirement, the loan amount updates automatically.
  useEffect(() => {
    if (tl.quotedPrice !== "") {
      setTl((t) => ({ ...t, tlAmount: Math.round(num(t.quotedPrice) * (1 - num(t.marginPercent) / 100)) }));
    }
  }, [tl.quotedPrice, tl.marginPercent]);

  // Working Capital: Limit Required is the source. Cost of Material = Limit ÷ (1 − Margin%), recalculated live
  // whenever the Limit or Margin % changes, so Cost − Margin always ties back to the Limit exactly.
  useEffect(() => {
    if (wc.wcLoanAmount !== "") {
      setWc((w) => ({ ...w, totalWcRequired: Math.round(num(w.wcLoanAmount) / (1 - num(w.marginPercent) / 100)) }));
    }
  }, [wc.wcLoanAmount, wc.marginPercent]);

  // ---------------- calculations ----------------
  const calc = useMemo(() => {
    // H1 sales & purchases
    const rows = ["high", "low", "avg"].map((key) => {
      const r = h1[key];
      const avgMonthlySale = r.dailySale !== "" ? num(r.dailySale) * 30 : num(r.avgMonthlySaleManual);
      const salesForPeriod = avgMonthlySale * num(r.months);
      const avgMonthlyPurchases = avgMonthlySale * (1 - num(r.margin) / 100);
      const totalPurchases = avgMonthlyPurchases * num(r.months);
      const totalOtherIncome = num(r.otherInc) * num(r.months);
      return { key, months: num(r.months), avgMonthlySale, salesForPeriod, totalPurchases, totalOtherIncome };
    });
    const totalMonths = sum(...rows.map((r) => r.months));
    const totalSales = sum(...rows.map((r) => r.salesForPeriod));
    const totalPurchases = sum(...rows.map((r) => r.totalPurchases));
    const totalOtherIncome = sum(...rows.map((r) => r.totalOtherIncome));
    const avgMonthlySaleTotal = totalMonths ? totalSales / totalMonths : 0;
    const blendedMargin = totalSales ? ((totalSales - totalPurchases) / totalSales) * 100 : 0;

    // H2 income & expenditure
    // Interest on loan outstanding auto-calculates (Outstanding × Rate) but can be overridden with the actual passbook figure.
    const interestShgAuto = num(credit.shgLoanOutstanding) * (num(credit.shgInterestRate) / 100);
    const interestBankAuto = num(credit.bankLoanOutstanding) * (num(credit.bankLoanInterestRate) / 100);
    const interestInformalAuto = num(credit.informalLoan) * (num(credit.informalLoanInterestRate) / 100);
    const interestOtherBankAuto = num(h3.clBankLoanST) * (num(h3.clBankLoanSTRate) / 100);
    // Interest paid is now a required MANUAL figure (the actual outstanding balance changes through the year as
    // EMIs are paid, so "Outstanding × Rate" is only a rough estimate) — the auto figures above are shown as a
    // reference only. If left blank, it's treated as ₹0 and Health Check flags it (loan outstanding, no interest entered).
    const interestShgFinal = num(h2.interestShgOverride);
    const interestBankFinal = num(h2.interestBankOverride);
    const interestInformalFinal = num(h2.interestInformalOverride);
    const interestOtherBankFinal = num(h2.interestOtherBankOverride);
    const expenditureSum = sum(...H2_EXPENDITURE_FIELDS.map((f) => h2[f.k])) + interestShgFinal + interestBankFinal + interestInformalFinal + interestOtherBankFinal;
    const opexOnly = expenditureSum - interestShgFinal - interestBankFinal - interestInformalFinal - interestOtherBankFinal; // Operating Expenses, excluding interest (single source for CA-style breakout)
    const totalExpenditure = totalPurchases + expenditureSum;
    const totalIncome = totalSales + totalOtherIncome + num(govtSubsidy);

    // Holding-period-based auto-calculation (standard operating-cycle method): value = (annual flow ÷ 365) × holding days.
    // The single "Total Working Capital Cycle" (F2) is the NET operating cycle: Raw Material + Stock (Finished
    // Goods) + Debtors − Suppliers' Credit (supplier credit finances part of the cycle, so it's subtracted, not
    // added). How those days split depends on the Type of Enterprise (Step 2) — Trading has no Raw Material stage
    // (buys and resells as-is), Manufacturing holds both Raw Material and Finished Goods, Services holds little
    // finished-goods stock but some Raw Material/consumables. Debtors is always the residual so the net formula
    // lands exactly on the total entered.
    const wcCycleTotal = num(wc.wcCycleDays);
    const { rawMaterialDays, stockHoldingDays, suppliersDays, debtorsDays } = holdingComposition(enterprise.enterpriseType, wcCycleTotal);

    const dailyPurchases = totalPurchases / 365;
    const dailySales = totalSales / 365;
    const rawMaterialValueAuto = dailyPurchases * rawMaterialDays;
    const stockValueAuto = dailyPurchases * stockHoldingDays;
    const debtorsAuto = dailySales * debtorsDays;
    const creditorsAuto = dailyPurchases * suppliersDays;

    // Closing Stock (total inventory) is auto-calculated from the holding periods above — Raw Material + Finished
    // Goods combined, matching standard accounting practice (total inventory on hand, not just finished goods).
    // CRITICAL ACCOUNTING FIX: COGS = Opening Stock + Purchases − Closing Stock; Gross Profit = Sales − COGS;
    // Net Profit is derived FROM Gross Profit (not from Total Purchases directly), so Closing Stock correctly
    // reduces COGS (raising profit) and Opening Stock correctly adds to COGS (reducing profit). Previously Net
    // Profit was computed as Total Income − Total Expenditure (Sales + Other Income + Subsidy − Purchases − Opex
    // − Interest), which silently ignored Opening/Closing Stock entirely — that was a real bug, now corrected.
    const closingStock = stockValueAuto + rawMaterialValueAuto;
    const cogs = num(openingStock) + totalPurchases - closingStock;
    const grossProfit = totalSales - cogs;
    const grossMargin = totalSales ? (grossProfit / totalSales) * 100 : 0;
    const netProfit = grossProfit + totalOtherIncome + num(govtSubsidy) - expenditureSum;
    const netMargin = totalSales ? (netProfit / totalSales) * 100 : 0;
    const avgMonthlyNetProfit = netProfit / 12;

    // H3 balance sheet
    const totalCL = sum(num(credit.shgLoanOutstanding), num(credit.informalLoan), creditorsAuto, ...CL_FIELDS.map((f) => h3[f.k]));
    const totalLTL = sum(num(credit.bankLoanOutstanding), ...LTL_FIELDS.map((f) => h3[f.k]));
    const totalCA = sum(num(credit.cumulativeShgSavings), num(credit.ownSbSavings), num(credit.fdRd), num(credit.otherSavings), stockValueAuto, rawMaterialValueAuto, debtorsAuto, ...CA_FIELDS.map((f) => h3[f.k]));
    const totalFA = sum(...FA_FIELDS.map((f) => h3[f.k]));
    const totalOA = sum(...OA_FIELDS.map((f) => h3[f.k]));
    const totalAssets = totalCA + totalFA + totalOA;
    // Owner's Capital = Total Assets − Total Liabilities other than capital (i.e. other than net worth)
    const ownersCapital = totalAssets - totalCL - totalLTL;
    const totalNetWorth = ownersCapital;
    const totalLiabilities = totalCL + totalLTL + totalNetWorth;
    const balances = Math.round(totalAssets) === Math.round(totalLiabilities); // true by construction — capital is the plug

    // Projections (recomputed correctly — see note to user about the original template's disconnected formulas).
    // Y2/Y3 Net Profit now properly flows through Opening/Closing Stock (COGS-based), the same accounting principle
    // as the Last Year Actual P&L above — not just Sales − Purchases − Opex. Opening Stock for Year 2 rolls forward
    // from Last Year's actual Closing Stock (single source, no duplicate figure); Closing Stock for Year 2/3 is an
    // ESTIMATE using the same holding-period composition applied to that year's projected Purchases — labelled as
    // such wherever shown, and reused as-is (not recalculated) for the Year 2 Balance Sheet below.
    const opexY1 = totalExpenditure - totalPurchases; // operating expenditure excl. purchases
    const salesY2 = totalSales * (1 + proj.growthSalesY2 / 100);
    const salesY3 = salesY2 * (1 + proj.growthSalesY3 / 100);
    const opexY2 = opexY1 * (1 + proj.growthOpexY2 / 100);
    const opexY3 = opexY2 * (1 + proj.growthOpexY3 / 100);
    const purchasesY2 = salesY2 * (1 - blendedMargin / 100);
    const purchasesY3 = salesY3 * (1 - blendedMargin / 100);
    const annualEmi = num(loanF.proposedEmi) * 12;

    const dailyPurchasesY2 = purchasesY2 / 365;
    const dailySalesY2 = salesY2 / 365;
    const openingStockY2 = closingStock; // rolls forward from Last Year Actual — single source
    const closingStockY2 = dailyPurchasesY2 * (stockHoldingDays + rawMaterialDays); // Estimated/Auto — Raw Material + Finished Goods combined
    const cogsY2 = openingStockY2 + purchasesY2 - closingStockY2;
    const grossProfitY2 = salesY2 - cogsY2;

    const dailyPurchasesY3 = purchasesY3 / 365;
    const openingStockY3 = closingStockY2; // rolls forward from Year 2 estimate
    const closingStockY3 = dailyPurchasesY3 * (stockHoldingDays + rawMaterialDays); // Estimated/Auto — Raw Material + Finished Goods combined
    const cogsY3 = openingStockY3 + purchasesY3 - closingStockY3;
    const grossProfitY3 = salesY3 - cogsY3;

    const netProfitY1 = netProfit;
    const netProfitY2 = grossProfitY2 - opexY2;
    const netProfitY3 = grossProfitY3 - opexY3;

    // Working Capital Assessment — Tandon Committee method (Method I & II) + Turnover method (Nayak Committee)
    // Bank Loan Outstanding (credit.bankLoanOutstanding) is a long-term liability (part of totalLTL), not a current
    // liability — only clBankLoanST (short-term/OD) and the SHG loan belong in the current-liabilities exclusion.
    const clBankBorrowings = num(h3.clBankLoanST) + num(credit.shgLoanOutstanding);
    const clOtherThanBankBorrowings = totalCL - clBankBorrowings;
    const workingCapitalGap = totalCA - clOtherThanBankBorrowings;
    const tandonMethod1Mpbf = Math.max(workingCapitalGap, 0) * 0.75;
    const tandonMethod1Nwc = Math.max(workingCapitalGap, 0) * 0.25;
    const tandonMethod2Mpbf = Math.max(totalCA * 0.75 - clOtherThanBankBorrowings, 0);
    const tandonMethod2Nwc = totalCA * 0.25;

    // Turnover Method now uses PROJECTED (Year 2 estimated) turnover by default, not last year's actual — a loan is
    // repaid out of future performance, not the past, especially when it funds growth. Still overridable manually.
    const projectedTurnover = projectedTurnoverOverride !== "" ? num(projectedTurnoverOverride) : salesY2;
    const turnoverWcRequirement = projectedTurnover * 0.25;
    const turnoverMargin = projectedTurnover * 0.05;
    const turnoverBankFinance = projectedTurnover * 0.20;

    // Household
    const hhIncomeTotal = sum(...K2_INCOME_FIELDS.map((f) => hhInc[f.k]));
    // Business profit feeding into eligibility now uses the PROJECTED Year 2 net profit, not last year's actual —
    // repayment happens out of expected future performance during the loan period, not historical results.
    const businessProfitLinked = Math.max(netProfitY2, 0);
    const hhIncomeTotalWithBiz = hhIncomeTotal + businessProfitLinked;
    const hhExpTotal = sum(...K2_EXPENDITURE_FIELDS.map((f) => hhExp[f.k])) + num(credit.shgEmi) * 12 + num(credit.bankLoanEmi) * 12 + num(credit.informalLoanEmi) * 12;
    const householdSurplusAnnual = hhIncomeTotalWithBiz - hhExpTotal;
    const monthlyHHIncome = hhIncomeTotalWithBiz / 12;
    const monthlyHHExpenditure = hhExpTotal / 12;
    const monthlyHouseholdSurplus = householdSurplusAnnual / 12;

    // Total Project Cost & Total Loan Requested — derived from Working Capital + Term Loan, not entered separately.
    const tlAmount = num(tl.tlAmount);
    const wcLoanAmount = num(wc.wcLoanAmount);
    const totalProjectCost = num(tl.quotedPrice) + num(wc.totalWcRequired);
    const totalLoanRequested = tlAmount + wcLoanAmount;
    const marginMoneyDerived = totalProjectCost - totalLoanRequested;

    // K3 EMI schedule
    const totalMonthlyEmi = num(credit.shgEmi) + num(credit.bankLoanEmi) + num(credit.informalLoanEmi) + num(loanF.proposedEmi);
    const netCashSurplusAfterAllEmis = monthlyHouseholdSurplus - num(loanF.proposedEmi);

    // EMI Feasibility (Sheet 6) — EMI applies only to the Term Loan portion; Working Capital is assessed separately via Tandon/Turnover methods above.
    const emiMonthlyHHIncome = emiL1.monthlyHHIncomeOverride !== "" ? num(emiL1.monthlyHHIncomeOverride) : monthlyHHIncome;
    const emiMonthlyHHExpenditureExclEmi = monthlyHHExpenditure - num(credit.shgEmi) - num(credit.bankLoanEmi) - num(credit.informalLoanEmi);
    const emiMonthlyHHExpenditure = emiL1.monthlyHHExpenditureOverride !== "" ? num(emiL1.monthlyHHExpenditureOverride) : emiMonthlyHHExpenditureExclEmi;
    const existingEmiBank = emiL1.existingEmiBankOverride !== "" ? num(emiL1.existingEmiBankOverride) : num(credit.bankLoanEmi);
    const existingEmiShg = num(credit.shgEmi);
    const existingEmiInformal = num(credit.informalLoanEmi);
    const totalExistingEmi = existingEmiShg + existingEmiBank + existingEmiInformal;

    // Moratorium: interest still accrues (and compounds) during the payment-free period, so the EMI (once it
    // starts) is calculated on the capitalized principal, not the original loan amount.
    const moratoriumMonths = num(tl.moratoriumMonths);
    const monthlyRateForMoratorium = num(loanF.interestRate) / 100 / 12;
    const tlPrincipalAfterMoratorium = tlAmount * Math.pow(1 + monthlyRateForMoratorium, moratoriumMonths);

    const calculatedEmi = pmt(tlPrincipalAfterMoratorium, loanF.interestRate, loanF.tenureMonths);
    const surplusBeforeNewEmi = emiMonthlyHHIncome - emiMonthlyHHExpenditure - totalExistingEmi;
    const surplusAfterNewEmi = surplusBeforeNewEmi - calculatedEmi;
    const safeEmiCapacity = Math.max(surplusBeforeNewEmi, 0) * 0.5;
    const maxPrincipalAfterMoratorium = maxLoanFromEmi(safeEmiCapacity, loanF.interestRate, loanF.tenureMonths);
    // Discount back through the moratorium capitalization so this is comparable to the originally-requested (pre-moratorium) amount.
    const maxEligibleLoan = moratoriumMonths > 0 ? maxPrincipalAfterMoratorium / Math.pow(1 + monthlyRateForMoratorium, moratoriumMonths) : maxPrincipalAfterMoratorium;
    const minTenureMonths = minTenure(tlPrincipalAfterMoratorium, loanF.interestRate, safeEmiCapacity);

    const foir = emiMonthlyHHIncome ? ((totalExistingEmi + calculatedEmi) / emiMonthlyHHIncome) * 100 : 0;
    const dscr = (totalExistingEmi + calculatedEmi) ? (surplusBeforeNewEmi + calculatedEmi + totalExistingEmi) / (totalExistingEmi + calculatedEmi) : 0;

    // DSCR-based eligibility rating — banks generally treat 1.5 and above as comfortable/recommended.
    let dscrLabel = "Weak — Not Recommended";
    let dscrTone = "danger";
    if (dscr >= 1.5) { dscrLabel = "Good — Recommended (DSCR ≥ 1.5)"; dscrTone = "ok"; }
    else if (dscr >= 1) { dscrLabel = "Moderate — Recommend with Conditions (DSCR 1.0–1.49)"; dscrTone = "warn"; }

    // Recommendation is based on the Term Loan (EMI-based) portion, AND now DSCR — up to 1.5 is the recommended
    // threshold (a bank's usual comfort level), not just whether the amount technically fits the EMI capacity.
    let recommendation = "Not Recommended";
    let tone = "danger";
    const loanReq = tlAmount;
    const withinEligibility = loanReq > 0 && loanReq <= maxEligibleLoan;
    const withinEligibilityConditions = loanReq > 0 && loanReq <= maxEligibleLoan * 1.1;
    if (withinEligibility && dscr >= 1.5) { recommendation = "Recommend"; tone = "ok"; }
    else if (withinEligibilityConditions && dscr >= 1) { recommendation = "Recommend with Conditions"; tone = "warn"; }

    // Instead of a flat "Not Recommended", also work out what CAN actually be recommended: the affordable Term
    // Loan (capped at EMI eligibility) and the affordable Working Capital/CC limit (capped at the higher of the
    // Tandon Method II or Turnover Method ceiling) — whichever is lower than what was requested.
    const wcEligibleLimit = Math.max(tandonMethod2Mpbf, turnoverBankFinance);
    const recommendedTermLoan = Math.max(Math.min(tlAmount, maxEligibleLoan), 0);
    const recommendedWc = Math.max(Math.min(wcLoanAmount, wcEligibleLimit), 0);
    const termLoanWasReduced = recommendedTermLoan < tlAmount - 1;
    const wcWasReduced = recommendedWc < wcLoanAmount - 1;

    // Balance Sheet — Projected (Year 2), WITH the recommended loan facilities applied (this is what the balance
    // sheet would look like after the Term Loan is disbursed and used to buy the asset, and the household carries
    // on trading at the Year 2 projected level). Stock reuses the SAME figure already computed for the Year 2 P&L
    // above (single source — never recalculated separately). Debtors/Creditors use the same holding-period
    // composition, applied to Year 2 Sales/Purchases. Existing SHG/Bank/Informal balances are carried forward
    // unchanged (no amortization schedule tracked).
    const debtorsY2 = dailySalesY2 * debtorsDays;
    const creditorsY2 = dailyPurchasesY2 * suppliersDays;
    const stockY2 = closingStockY2; // single source — same value shown as Year 2 Closing Stock in the P&L

    const faY2 = totalFA + num(tl.quotedPrice);
    const oaY2 = totalOA;
    const caY2 = sum(num(credit.cumulativeShgSavings), num(credit.ownSbSavings), num(credit.fdRd), num(credit.otherSavings), stockY2, debtorsY2, ...CA_FIELDS.map((f) => h3[f.k]));
    const totalAssetsY2 = caY2 + faY2 + oaY2;
    const clY2 = sum(num(credit.shgLoanOutstanding), num(credit.informalLoan), creditorsY2, ...CL_FIELDS.map((f) => h3[f.k]));
    const ltlY2 = sum(num(credit.bankLoanOutstanding), recommendedTermLoan, ...LTL_FIELDS.map((f) => h3[f.k]));

    // Capital is NOT a blind balancing plug here: it is rolled forward from Last Year's actual Capital using Net
    // Profit and Drawings (both independently known) — Closing Capital = Opening Capital + Net Profit − Drawings.
    // Assets are then INDEPENDENTLY checked against Liabilities + this rolled-forward Capital; if they don't match,
    // that's surfaced as a genuine Balance Sheet Mismatch (Health Check) rather than silently hidden by a plug —
    // a real projection commonly won't tally exactly, since the new asset purchase and margin money aren't tracked
    // through a full cash-flow statement in this simplified 1-year model.
    const ownersCapitalY2 = ownersCapital + netProfitY2 - num(drawings);
    const totalLiabilitiesY2 = clY2 + ltlY2 + ownersCapitalY2;
    const bsMismatchY2 = totalAssetsY2 - totalLiabilitiesY2;
    const bsMismatchY2Flag = Math.abs(bsMismatchY2) > 1;

    return {
      rows, totalSales, totalPurchases, totalOtherIncome, avgMonthlySaleTotal, blendedMargin,
      totalExpenditure, totalIncome, netProfit, netMargin, closingStock, cogs, grossProfit, grossMargin, avgMonthlyNetProfit, opexOnly,

      clOtherThanBankBorrowings, workingCapitalGap, tandonMethod1Mpbf, tandonMethod1Nwc, tandonMethod2Mpbf, tandonMethod2Nwc,
      projectedTurnover, turnoverWcRequirement, turnoverMargin, turnoverBankFinance,
      tlAmount, wcLoanAmount, totalProjectCost, totalLoanRequested, marginMoneyDerived, stockValueAuto, rawMaterialValueAuto, debtorsAuto, creditorsAuto, rawMaterialDays, stockHoldingDays, debtorsDays, suppliersDays, interestShgAuto, interestBankAuto, interestInformalAuto, interestOtherBankAuto, interestShgFinal, interestBankFinal, interestInformalFinal, interestOtherBankFinal, moratoriumMonths, tlPrincipalAfterMoratorium,
      salesY2, salesY3, opexY2, opexY3, purchasesY2, purchasesY3, netProfitY1, netProfitY2, netProfitY3, annualEmi,
      openingStockY2, closingStockY2, cogsY2, grossProfitY2, openingStockY3, closingStockY3, cogsY3, grossProfitY3,
      hhIncomeTotalWithBiz, hhExpTotal, householdSurplusAnnual, monthlyHHIncome, monthlyHHExpenditure, monthlyHouseholdSurplus, businessProfitLinked,
      totalMonthlyEmi, netCashSurplusAfterAllEmis,

  async function loadSubmissions() {

    try {
      const listRes = await LocalStore.list("submissions:");
      const keys = listRes?.keys || [];
      const items = [];
      for (const key of keys) {
        try {
          const res = await LocalStore.get(key);
          if (res?.value) items.push(JSON.parse(res.value));
        } catch (e) {
          // skip unreadable entry
        }
      }
      items.sort((a, b) => new Date(b.submittedAt) - new Date(a.submittedAt));

  function loadScriptOnce(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) return resolve();
      const s = document.createElement("script");
      s.src = src;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error("script load failed"));
      document.body.appendChild(s);
    });
  }

  function importData(file) {

        setImportOk(true);
      } catch (err) {
        setImportError("Couldn't read that file — make sure it's a JSON file exported from this app (via 'Export Data').");

  const missingRequired = () => {
    if (step === 0) return [!identity.shgName && "Name of SHG", !identity.memberName && "Member Name"].filter(Boolean);
    if (step === 1) return [!enterprise.enterpriseName && "Enterprise Name", tl.tlAmount === "" && wc.wcLoanAmount === "" && "Working Capital or Term Loan Amount"].filter(Boolean);
    return [];
  };

  const monthsTotal = num(h1.high.months) + num(h1.low.months) + num(h1.avg.months);
  const monthsDiff = 12 - monthsTotal;

  const hardBlockReason = () => {
    if (step === 0) {
      const pending = DOCUMENTS.filter((d) => documents[d.k].status !== "Collected" && documents[d.k].status !== "Not Applicable").map((d) => d.l.split(" / ")[0]);
      if (pending.length) return `All documents must be marked Collected (or Not Applicable) before continuing. Still pending: ${pending.join(", ")}. / आगे बढ़ने से पहले सभी दस्तावेज़ Collected होने चाहिए।`;
    }
    if (step === 2) {
      if (monthsTotal !== 12) return `High + Low + Average period months must add up to 12 (currently ${monthsTotal}, difference of ${monthsDiff > 0 ? monthsDiff + " short" : Math.abs(monthsDiff) + " over"}). / महीनों का कुल योग 12 होना चाहिए (वर्तमान: ${monthsTotal})।`;
    }
    return null;
  };

  const issues = useMemo(() => {
    const list = [];
    const missingMandatory = MEMBER_FIELDS.filter((f) => f.mandatory && !identity[f.k]).map((f) => f.l);
    if (missingMandatory.length)
      list.push({ tone: "warn", title: "Missing mandatory member details", detail: `${missingMandatory.join(", ")} not filled in.`, fix: "Complete these fields in Step 1 (Identity) — required for KYC and bank submission." });

    const pendingMandatoryDocs = DOCUMENTS.filter((d) => d.mandatory && documents[d.k].status !== "Collected").map((d) => d.l);
    if (pendingMandatoryDocs.length)
      list.push({ tone: "warn", title: "Mandatory documents not yet collected", detail: pendingMandatoryDocs.join(", "), fix: "Collect these before submitting the application to the bank." });

    if (calc.ownersCapital < 0)
      list.push({ tone: "danger", title: "Negative owner's capital", detail: `Total liabilities other than capital (${inr(calc.totalCL + calc.totalLTL)}) exceed total assets (${inr(calc.totalAssets)}) by ${inr(Math.abs(calc.ownersCapital))}.`, fix: "The business may be technically insolvent on paper. Re-check liability entries in Step 3, or this loan needs stronger justification before proceeding." });

    if (enterprise.premises !== "Rented" && num(h2.rent) > 0)
      list.push({ tone: "warn", title: "Rent booked but premises not marked Rented", detail: `Business Premises is "${enterprise.premises || "not set"}" but ${inr(num(h2.rent))} of Rent is booked in Income & Expenditure (Step 3).`, fix: "If rent is genuinely paid, set Business Premises to 'Rented' in Step 2. If the premises is owned, remove the Rent expense instead." });

    if (enterprise.enterpriseType === "Manufacturing" && num(h3.plantMachinery) === 0)
      list.push({ tone: "warn", title: "Manufacturing business with zero machinery", detail: "Type of Enterprise is 'Manufacturing' but Plant & Machinery in the Balance Sheet (Step 3, Fixed Assets) is ₹0.", fix: "Manufacturing typically needs some machinery/equipment — check if this was missed in Step 3, or correct the Type of Enterprise in Step 2 if it's actually Trading/Services." });

    if (enterprise.startDate) {
      const businessAgeYears = (new Date() - new Date(enterprise.startDate)) / (1000 * 60 * 60 * 24 * 365.25);
      if (businessAgeYears >= 0 && num(enterprise.experience) > businessAgeYears + 1) {
        const ageDisplay = businessAgeYears < 1 ? `${Math.round(businessAgeYears * 12)} months` : `${businessAgeYears.toFixed(1)} years`;
        list.push({ tone: "warn", title: "Business age doesn't match stated experience", detail: `Business Start Date implies the business is about ${ageDisplay} old, but Business Experience is entered as ${enterprise.experience} years.`, fix: "Check Business Start Date and Business Experience in Step 2 — one of them is likely incorrect (experience may include time before this specific enterprise, or the start date may be wrong)." });
      }
    }

    if (num(enterprise.employees) > 0 && num(h2.wages) === 0)
      list.push({ tone: "warn", title: "Employees present but zero wage expense", detail: `No. of Employees is ${enterprise.employees} but Wages & Labour in Income & Expenditure (Step 3) is ₹0.`, fix: "If employees are paid, add the wage expense in Step 3. If they're unpaid family members, use Family Labour instead and consider setting No. of Employees to 0." });

    if (num(tl.assetLife) > 0 && num(tl.assetLife) * 12 < num(loanF.tenureMonths))
      list.push({ tone: "warn", title: "Repayment period exceeds the asset's useful life", detail: `Estimated Life of Asset is ${tl.assetLife} years (${num(tl.assetLife) * 12} months), but the Repayment Period requested is ${loanF.tenureMonths} months.`, fix: "Shorten the repayment period to within the asset's useful life, or double-check the asset life estimate in Step 2 (F3) — banks generally avoid financing beyond an asset's productive life." });

    if (k1.existingHhLoan === "No" && (num(credit.shgLoanOutstanding) > 0 || num(credit.bankLoanOutstanding) > 0 || num(credit.informalLoan) > 0))
      list.push({ tone: "warn", title: "\"No existing household loan\" contradicts Section E", detail: "Household Profile (Step 5, K1) says there's no existing household loan, but Section E (Step 2) shows an outstanding SHG, Bank, and/or Informal loan.", fix: "Update K1 to 'Yes' if these loans are genuinely outstanding, or correct Section E if they've already been repaid." });

    if (num(k1.earningMembers) > num(k1.totalMembers) && num(k1.totalMembers) > 0)
      list.push({ tone: "danger", title: "Earning members exceed total family members", detail: `Household Profile shows ${k1.earningMembers} earning members out of ${k1.totalMembers} total family members.`, fix: "Check Total Family Members and Earning Members in Step 5 (K1) — earning members can't exceed the total." });

    if (enterprise.startDate && new Date(enterprise.startDate) > new Date())
      list.push({ tone: "danger", title: "Business Start Date is in the future", detail: `Business Start Date is set to ${enterprise.startDate}.`, fix: "Correct the Business Start Date in Step 2 — it should be a date in the past." });

    if (num(credit.loansLast3Yrs) === 0 && num(credit.lastLoanAmount) > 0)
      list.push({ tone: "warn", title: "No SHG loans in last 3 years, but a last loan amount is entered", detail: `No. of Loans from SHG (Last 3 Yrs) is 0, but Amount of Last SHG Loan is ${inr(num(credit.lastLoanAmount))}.`, fix: "Check Section E (Step 2) — if there really were no loans in the last 3 years, the last loan amount should likely be blank or from an earlier period." });

    if (identity.dob) {
      const ageYears = (new Date() - new Date(identity.dob)) / (1000 * 60 * 60 * 24 * 365.25);
      if (ageYears > 0 && num(enterprise.experience) > ageYears - 12) {
        list.push({ tone: "warn", title: "Business experience implies starting at an implausibly young age", detail: `Member's age is about ${Math.floor(ageYears)} years, but Business Experience of ${enterprise.experience} years implies the business started around age ${Math.round(ageYears - num(enterprise.experience))}.`, fix: "Check Date of Birth and Business Experience in Steps 1 and 2 — one of them is likely incorrect." });
      }
    }

    if (num(credit.shgLoanOutstanding) > 0 && calc.interestShgFinal === 0)
      list.push({ tone: "danger", title: "SHG Loan outstanding but no interest entered", detail: `SHG Loan Outstanding is ${inr(num(credit.shgLoanOutstanding))}, but Interest Paid to SHG in Step 3 (P&L) is blank/0.`, fix: "Fill the actual interest paid from the SHG passbook in Step 3 — this is a required manual entry, since it should reflect the real amount paid, not an estimate." });

    if (num(credit.bankLoanOutstanding) > 0 && calc.interestBankFinal === 0)
      list.push({ tone: "danger", title: "Bank Loan outstanding but no interest entered", detail: `Bank Loan Outstanding is ${inr(num(credit.bankLoanOutstanding))}, but Interest Paid on Bank Loan in Step 3 (P&L) is blank/0.`, fix: "Fill the actual interest paid from the bank passbook/statement in Step 3 — this is a required manual entry." });

    if (num(credit.informalLoan) > 0 && calc.interestInformalFinal === 0)
      list.push({ tone: "danger", title: "Informal Loan outstanding but no interest entered", detail: `Informal Loan is ${inr(num(credit.informalLoan))}, but Interest Paid on Informal Loan in Step 3 (P&L) is blank/0.`, fix: "Fill the actual interest amount paid in Step 3, if any is charged on this loan." });

    if (num(h3.clBankLoanST) > 0 && calc.interestOtherBankFinal === 0)
      list.push({ tone: "danger", title: "Other Bank Loan/OD outstanding (Balance Sheet) but no interest entered", detail: `Other Bank Loan/OD Outstanding in the Balance Sheet (Step 3) is ${inr(num(h3.clBankLoanST))}, but its Interest Paid in the P&L is blank/0.`, fix: "Fill the actual interest paid from the passbook for this loan in Step 3." });

    if (calc.totalFA > 0 && num(h2.depreciation) === 0)
      list.push({ tone: "warn", title: "Fixed assets present but zero depreciation charged", detail: `Total Fixed Assets in the Balance Sheet is ${inr(calc.totalFA)}, but Depreciation in Income & Expenditure (Step 3) is ₹0.`, fix: "Fixed assets like machinery, furniture, or vehicles normally lose value over time — add an estimated depreciation expense in Step 3, or confirm if these assets are genuinely non-depreciating (e.g. land)." });

    if (calc.cogs > calc.totalSales && calc.totalSales > 0)
      list.push({ tone: "warn", title: "Cost of Goods Sold exceeds Sales", detail: `COGS is ${inr(calc.cogs)} against Sales of ${inr(calc.totalSales)}.`, fix: "Re-check Opening Stock, Purchases, and Closing Stock (Balance Sheet) figures in Step 3 — one of these is likely overstated or understated." });

    if (calc.cogs < 0)
      list.push({ tone: "danger", title: "Cost of Goods Sold is negative", detail: `COGS works out to ${inr(calc.cogs)} — Closing Stock (${inr(calc.closingStock)}) exceeds Opening Stock (${inr(num(openingStock))}) plus Purchases (${inr(calc.totalPurchases)}) combined.`, fix: "Re-check Opening Stock and the Working Capital Cycle (Step 2, F2) that drives Closing Stock — the stock holding period may be set too high relative to actual Purchases." });

    if (calc.bsMismatchY2Flag)
      list.push({ tone: "warn", title: "Year 2 Projected Balance Sheet does not tally", detail: `Projected Total Assets (${inr(calc.totalAssetsY2)}) differ from Capital + Liabilities (${inr(calc.totalLiabilitiesY2)}) by ${inr(Math.abs(calc.bsMismatchY2))}. Unlike the Last Year Actual sheet, Year 2 Capital is rolled forward (Opening Capital + Net Profit − Drawings) rather than plugged, so a real gap can show up.`, fix: "This is expected in a simplified 1-year projection — the new asset purchase and margin money aren't tracked through a full cash-flow statement. Treat the Year 2 sheet as an estimate; it does not affect the Last Year Actual sheet, which still tallies exactly." });

    if (calc.netProfit < 0)
      list.push({ tone: "danger", title: "Business is loss-making", detail: `Net loss of ${inr(Math.abs(calc.netProfit))} for the year.`, fix: "Review expenditure heads for overstatement, or hold off on this loan until margins improve." });

    if (calc.monthlyHouseholdSurplus < 0)
      list.push({ tone: "warn", title: "Household surplus is negative", detail: `Shortfall of ${inr(Math.abs(calc.monthlyHouseholdSurplus))}/month before any new loan.`, fix: "Reduce discretionary household expenses in Step 5, or confirm all income sources are captured." });

    if (calc.dscr > 0 && calc.dscr < 1.5)
      list.push({ tone: "warn", title: "DSCR below the recommended threshold of 1.5", detail: `Current DSCR is ${calc.dscr.toFixed(2)}.`, fix: "Consider a longer tenure or a smaller loan amount to raise DSCR to 1.5 or above — this is what the app uses to decide the recommendation." });

    if (calc.foir > 50)
      list.push({ tone: "warn", title: "FOIR above the 50% banking norm", detail: `Current FOIR is ${pct(calc.foir)}.`, fix: "Reduce the loan amount or extend tenure to bring EMI obligations below 50% of income." });

    if (calc.tlAmount > calc.maxEligibleLoan && calc.maxEligibleLoan > 0)
      list.push({ tone: "danger", title: "Term Loan amount exceeds EMI eligibility", detail: `Term Loan requested ${inr(calc.tlAmount)} vs eligible ${inr(calc.maxEligibleLoan)} (based on repayment capacity).`, fix: `Reduce the Term Loan to ${inr(calc.maxEligibleLoan)}, increase own contribution, or extend the repayment period.` });

    if (calc.minTenureMonths === null && calc.tlAmount > 0)
      list.push({ tone: "danger", title: "Term Loan may not be repayable at any tenure", detail: "Safe EMI capacity is too low to ever cover interest on the requested Term Loan principal.", fix: "Reduce the Term Loan amount substantially, or grow business/household income before proceeding." });

    if (num(tl.quotedPrice) > 0 && calc.tlAmount >= num(tl.quotedPrice) * 0.98)
      list.push({ tone: "warn", title: "Term Loan amount looks like the full asset cost", detail: `Term Loan requested ${inr(calc.tlAmount)} is almost equal to the asset cost of ${inr(num(tl.quotedPrice))}.`, fix: `Margin money (currently set at ${num(tl.marginPercent)}%) should come from the applicant. Term Loan should be Asset Cost − Margin ≈ ${inr(num(tl.quotedPrice) * (1 - num(tl.marginPercent) / 100))}, not the full cost.` });

    if (num(wc.totalWcRequired) > 0 && calc.wcLoanAmount >= num(wc.totalWcRequired) * 0.98)
      list.push({ tone: "warn", title: "Working Capital loan looks like the full requirement", detail: `WC loan requested ${inr(calc.wcLoanAmount)} is almost equal to the WC requirement of ${inr(num(wc.totalWcRequired))}.`, fix: `Margin money (currently set at ${num(wc.marginPercent)}%) should come from the applicant. WC Loan should be Requirement − Margin ≈ ${inr(num(wc.totalWcRequired) * (1 - num(wc.marginPercent) / 100))}, not the full amount.` });

    const wcEligible = Math.max(calc.tandonMethod2Mpbf, calc.turnoverBankFinance);
    if (calc.wcLoanAmount > wcEligible && wcEligible > 0)
      list.push({ tone: "warn", title: "Working capital request exceeds assessed eligibility", detail: `Requested ${inr(calc.wcLoanAmount)} vs the higher of Tandon Method II (${inr(calc.tandonMethod2Mpbf)}) and Turnover Method (${inr(calc.turnoverBankFinance)}).`, fix: "Reduce the working capital loan amount to align with the bank assessment methods shown in Step 3, or provide justification for the higher requirement." });

    return list;
  }, [calc, identity, documents, wc, tl, enterprise, h2, h3, k1]);

  const contextSummary = `Step: ${STEPS[step]}. SHG: ${identity.shgName || "—"}. Enterprise: ${enterprise.enterpriseName || "—"}. Annual sales: ${inr(calc.totalSales)}. Net profit: ${inr(calc.netProfit)}. Term Loan requested: ${inr(calc.tlAmount)}. Total loan requested (WC+TL): ${inr(calc.totalLoanRequested)}. Max eligible Term Loan: ${inr(calc.maxEligibleLoan)}. DSCR: ${calc.dscr.toFixed(2)}. FOIR: ${pct(calc.foir)}. Recommendation: ${calc.recommendation}. Open issues: ${issues.length}.`;

  return (
    <div className="min-h-screen bg-stone-50 text-emerald-900" style={{ fontFamily: "'IBM Plex Sans', sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
        .serif { font-family: 'Source Serif 4', serif; }
        .mono { font-family: 'IBM Plex Mono', monospace; }
        @media print {
          .no-print { display: none !important; }
          .print-area { box-shadow: none !important; }
          .fs-print-fix { position: static !important; inset: auto !important; max-height: none !important; height: auto !important; overflow: visible !important; background: none !important; display: block !important; }
        }
      `}</style>

      <div className="bg-emerald-900 text-stone-50 px-5 py-4 no-print">
        <div className="flex items-center justify-between">
          <div className="flex items-center gap-2">
